name: Character rig and pose review
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'missions/*bridge.js'
      - 'tests/*rig.cjs'
      - 'tests/all-character-poses.cjs'
      - '.github/workflows/character-rig.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  character-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright jsdom sharp
      - run: npx playwright install --with-deps chromium
      - run: node tests/hand-rig.cjs
      - run: node tests/body-rig.cjs
      - run: node tests/all-character-poses.cjs
        env:
          RENDER_OUTPUT: pose-review-renders
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-pose-review
          path: pose-review-renders
