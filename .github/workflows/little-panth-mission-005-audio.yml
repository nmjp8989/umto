name: Little Panth Mission 05 audio

on:
  push:
    branches: [main]
    paths:
      - 'little panth/mission-005/dialogue.json'
      - 'tools/little-panth-005-score.py'
      - '.github/workflows/little-panth-mission-005-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: little-panth-005-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the encoder and Punjabi speech recognizer
        run: python -m pip install --disable-pip-version-check imageio-ffmpeg numpy sherpa-onnx==1.13.0
      - name: Generate the narrator and crow recordings
        env:
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if python tools/build_little_panth_audio.py --mission mission-005; then
              exit 0
            fi
            if [ "$attempt" -lt 8 ]; then sleep 75; fi
          done
          exit 1
      - name: Align Gurmukhi words to the recorded lines
        run: |
          model=https://huggingface.co/parismitaglobalsolutions/indicconformer-sherpa-onnx/resolve/main
          curl --fail --location --retry 3 "$model/pa/model.int8.onnx" -o /tmp/lp005-punjabi.onnx
          curl --fail --location --retry 3 "$model/tokens.txt" -o /tmp/lp005-tokens.txt
          python tools/little-panth-004-align.py /tmp/lp005-punjabi.onnx /tmp/lp005-tokens.txt --mission mission-005
      - name: Generate a quiet Lyria instrumental cue
        if: always()
        continue-on-error: true
        env:
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/little-panth-005-score.py
      - name: Save the voice clips, score, and word timings
        if: always()
        run: |
          test -d "little panth/mission-005/audio" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "little panth/mission-005/audio/"
          git diff --cached --quiet && exit 0
          git commit -m 'Add Punjabi narration and audio for Little Panth Mission 05'
          git pull --rebase origin main
          git push origin HEAD:main
