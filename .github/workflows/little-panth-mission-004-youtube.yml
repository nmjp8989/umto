name: Little Panth Mission 04 YouTube reading-book render

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Little Panth Mission 04 Gemini Punjabi dialogue
    types: [completed]

permissions:
  contents: read

concurrency:
  group: little-panth-004-youtube
  cancel-in-progress: false

jobs:
  render:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome video and audio capture tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg pulseaudio pulseaudio-utils fonts-noto-core
          npm install --no-save --package-lock=false playwright-core@1.56.1
          node --check tools/little-panth-004-export.cjs
      - name: Make 1920x1080 two-page educational video
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=lp_export rate=48000
          pactl set-default-sink lp_export
          paplay --device=lp_export --raw --format=s16le --rate=48000 --channels=2 /dev/zero &
          silent_feed=$!
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lp004-video-http.log 2>&1 &
          server=$!
          trap 'kill "$silent_feed" "$server" 2>/dev/null || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/; then break; fi
            sleep 1
          done
          node tools/little-panth-004-export.cjs release
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,width,height,r_frame_rate -of compact release/mission-004.mp4
      - name: Downloadable YouTube release
        uses: actions/upload-artifact@v4
        with:
          name: little-panth-mission-004-youtube-1080p
          path: |
            release/mission-004.mp4
            release/mission-004-pa.srt
            release/thumbnail.png
            release/dialogue-timings.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
