name: Render Punjabi Gemini dialogue
on:
  push:
    branches: [animation/punjabi-bazaar-chai-20261110]
    paths: ['.github/workflows/punjabi-gemini-voice.yml']
permissions:
  contents: write
jobs:
  dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Generate six Punjabi lines with existing Umto voices
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,base64,sys,requests,wave,io
          from pathlib import Path
          sys.path.insert(0,'tools')
          def generate_mp3(text,voice,key):
              if not key: raise RuntimeError('Gemini API credential is not configured')
              payload={'contents':[{'parts':[{'text':'Speak naturally in Punjabi, warm conversational delivery. Say only: '+text}]}],'generationConfig':{'responseModalities':['AUDIO'],'speechConfig':{'voiceConfig':{'prebuiltVoiceConfig':{'voiceName':'Charon' if voice.startswith('male') else 'Kore'}}}}}
              r=requests.post('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent',headers={'x-goog-api-key':key},json=payload,timeout=150)
              if not r.ok: raise RuntimeError('Gemini audio request failed HTTP '+str(r.status_code))
              pcm=base64.b64decode(r.json()['candidates'][0]['content']['parts'][0]['inlineData']['data'])
              b=io.BytesIO()
              with wave.open(b,'wb') as f: f.setnchannels(1);f.setsampwidth(2);f.setframerate(24000);f.writeframes(pcm)
              return b.getvalue()
          lines=json.loads("[[\"harpreet\",\"male_sample.wav\",\"ਮੀਨਾ ਜੀ, ਤੁਹਾਡੀ ਚਾਹ ਵਿੱਚ ਕਿਹੜਾ ਜਾਦੂ ਹੈ?\"],[\"meena\",\"female_sample.wav\",\"ਇੱਕ ਘੁੱਟ ਪੀਓ, ਸਾਰੀਆਂ ਚਿੰਤਾਵਾਂ ਗਾਇਬ!\"],[\"harpreet\",\"male_sample.wav\",\"ਵਾਹ! ਫਿਰ ਤਾਂ ਅੱਜ ਦਾ ਬਿੱਲ ਵੀ ਗਾਇਬ ਹੋ ਜਾਣਾ ਚਾਹੀਦਾ!\"],[\"meena\",\"female_sample.wav\",\"ਬਿੱਲ ਨਹੀਂ ਜੀ, ਸਿਰਫ਼ ਚਿੰਤਾਵਾਂ!\"],[\"harpreet\",\"male_sample.wav\",\"ਚਲੋ, ਦੋ ਕੱਪ ਬਣਾ ਦਿਓ। ਇੱਕ ਮੇਰੇ ਲਈ, ਇੱਕ ਤੁਹਾਡੇ ਲਈ।\"],[\"meena\",\"female_sample.wav\",\"ਹੁਣ ਬਣੀ ਨਾ ਗੱਲ! ਚਾਹ ਦਾ ਅਸਲੀ ਜਾਦੂ ਤਾਂ ਸਾਥ ਹੈ।\"]]")
          root=Path('renders/punjabi-gemini');root.mkdir(parents=True,exist_ok=True)
          for i,(speaker,voice,text) in enumerate(lines):
              data=generate_mp3(text,voice,(os.environ.get('GEMINI_API_KEY') or os.environ.get('GOOGLE_API_KEY')))
              (root/f'line-{i}.wav.b64').write_text(base64.b64encode(data).decode())
              print(f'Completed line {i+1}')
          (root/'dialogue.json').write_text(json.dumps(lines,ensure_ascii=False,indent=2))
          PY
      - name: Save generated clips on this animation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add renders/punjabi-gemini
          git commit -m 'Generate Punjabi chai dialogue using existing Umto voices'
          git push origin HEAD:animation/punjabi-bazaar-chai-20261110
