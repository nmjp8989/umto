name: Little Panth Mission 04 Gemini Punjabi dialogue

on:
  push:
    branches: [main]
    paths:
      - 'little panth/mission-004/dialogue.json'
      - '.github/workflows/little-panth-mission-004-voice.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: little-panth-mission-004-voice
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and cache all 25 Gemini voice clips
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encoder
        run: python -m pip install --disable-pip-version-check imageio-ffmpeg
      - name: Check dialogue and generate recorded Punjabi narration
        env:
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          python tools/build_little_panth_audio.py --mission mission-004 --dry-run
          # Gemini's HTTP 429 is often a per-minute RPM throttle. The generator
          # caches every successful MP3; retries never rebill completed clips.
          for attempt in 1 2 3 4 5 6 7 8; do
            if python tools/build_little_panth_audio.py --mission mission-004 --max-new-lines 25; then
              break
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "Gemini quota still exceeded after bounded cooldowns." >&2
              exit 1
            fi
            echo "Gemini TTS temporarily unavailable; retrying only uncached dialogue after cooldown."
            sleep 75
          done
      - name: Save completed MP3 recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: little-panth-004-gemini-punjabi-dialogues
          path: |
            little panth/mission-004/audio/*.mp3
            little panth/mission-004/audio/generation-manifest.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit available voice clips to the website
        if: always()
        run: |
          test -f "little panth/mission-004/audio/generation-manifest.json" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "little panth/mission-004/audio/"
          git diff --cached --quiet && exit 0
          git commit -m 'Add Gemini Punjabi voices for Little Panth Mission 04'
          git pull --rebase origin main
          git push origin HEAD:main
