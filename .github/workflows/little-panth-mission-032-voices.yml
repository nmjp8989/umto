name: Little Panth Mission 32 Punjabi voices

on:
  push:
    branches: [main]
    paths:
      - 'little panth/mission-032/dialogue.json'
      - '.github/workflows/little-panth-mission-032-voices.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: little-panth-032-voices
  cancel-in-progress: false

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate story and animation
        run: |
          node --check 'little panth/mission-032/stage.js'
          node --check 'little panth/mission-032/player.js'
          node tests/little-panth-032.cjs
      - name: Install Punjabi audio tools
        run: python -m pip install --disable-pip-version-check imageio-ffmpeg numpy sherpa-onnx==1.13.0
      - name: Record the narrator, fox, and cat
        env:
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for attempt in 1 2 3 4 5 6 7; do
            if python tools/build_little_panth_audio.py --mission mission-032 --model gemini-3.8-flash-lite-tts ||
              python tools/build_little_panth_audio.py --mission mission-032; then
              exit 0
            fi
            if [ "$attempt" -lt 7 ]; then sleep 55; fi
          done
          exit 1
      - name: Align Gurmukhi text to the speech
        run: |
          model=https://huggingface.co/parismitaglobalsolutions/indicconformer-sherpa-onnx/resolve/main
          curl --fail --location --retry 3 "$model/pa/model.int8.onnx" -o /tmp/lp032-punjabi.onnx
          curl --fail --location --retry 3 "$model/tokens.txt" -o /tmp/lp032-tokens.txt
          python tools/little-panth-004-align.py /tmp/lp032-punjabi.onnx /tmp/lp032-tokens.txt --mission mission-032
      - name: Validate generated voices
        run: node tests/little-panth-032.cjs --audio
      - name: Save the clips and timing data
        if: always()
        run: |
          test -d "little panth/mission-032/audio" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "little panth/mission-032/audio/"
          git diff --cached --quiet && exit 0
          git commit -m 'Add recorded Punjabi voices for Little Panth Mission 32'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Install browser test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          npm install --no-save playwright-core@1.56.1
      - name: Start local static site
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lp032-server.log 2>&1 &
      - name: Test real narration and animated scenes
        run: node tests/little-panth-032-browser.cjs
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: little-panth-032-screenshots
          path: screenshots/little-panth-032/
          if-no-files-found: ignore
