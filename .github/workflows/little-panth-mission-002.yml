name: Little Panth Mission 2 production

on:
  push:
    branches: [main, little-panth-mission-002]
    paths:
      - 'little panth/mission-002/dialogue.json'
      - '.github/workflows/little-panth-mission-002.yml'
  workflow_dispatch:

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    concurrency:
      group: little-panth-mission-002-voices-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check imageio-ffmpeg
      - name: Generate Punjabi dialogue
        env:
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/build_little_panth_audio.py --mission mission-002
      - name: Save available clips
        if: always()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ ! -f "little panth/mission-002/audio/generation-manifest.json" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "little panth/mission-002/audio/*.mp3" "little panth/mission-002/audio/generation-manifest.json"
          git diff --cached --quiet && exit 0
          git commit -m 'Generate Mission 2 Punjabi dialogue'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright-core@1.56.1
      - run: sudo apt-get install -y fonts-noto-core
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lp-http.log 2>&1 &
      - run: node tests/little-panth-002-browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: mission-002-previews
          path: screenshots/mission-002
