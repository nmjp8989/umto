name: Little Panth Mission 08 browser quality check

on:
  push:
    paths:
      - 'little panth/mission-008/**'
      - 'little panth/mission-005/player.js'
      - 'little panth/mission-005/sound.js'
      - 'little panth/mission-005/review.js'
      - 'little panth/mission-004/reading.js'
      - 'little panth/mission-004/style.css'
      - 'index.html'
      - 'missions/character-bridge.js'
      - 'missions/native-character-player.js'
      - 'missions/delivery-camera.js'
      - 'tests/little-panth-008-browser.cjs'
      - '.github/workflows/little-panth-mission-008-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Mission 08 JavaScript
        run: |
          node --check 'little panth/mission-008/stage.js'
          node --check tests/little-panth-008-browser.cjs
      - name: Install Playwright against the runner Chrome
        run: npm install --no-save playwright-core@1.56.1
      - name: Start local static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lp008-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          exit 1
      - name: Check native traveller, long shawl, recorded voices and mobile
        env:
          LP008_OUTPUT: screenshots/little-panth-008
        run: node tests/little-panth-008-browser.cjs
      - name: Upload Mission 08 poses and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: little-panth-008-screenshots
          path: screenshots/little-panth-008/
          if-no-files-found: ignore
