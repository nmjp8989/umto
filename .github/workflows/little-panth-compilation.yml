name: Render Little Panth compilation
on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "Comma-separated episode IDs copied from the contents page (e.g. 005,034)"
        required: true
        default: "005,034"
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/little-panth-compilation.yml'
      - 'tools/little-panth-compilation-render.cjs'
      - 'tools/little-panth-compilation-assemble.py'
      - 'tests/little-panth-compilation.cjs'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      episodes: ${{ steps.plan.outputs.episodes }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: Validate selected episodes
        env:
          REQUESTED: ${{ inputs.episodes || '005,034' }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re
          ids=[s.strip() for s in os.environ["REQUESTED"].split(",")]
          if not ids or len(ids)>60 or len(set(ids))!=len(ids) or any(not re.fullmatch(r"[0-9]{3}",s) or not (pathlib.Path("little panth")/("mission-"+s)/"index.html").is_file() for s in ids):
              raise SystemExit("Invalid episode IDs; use the selection from the contents page.")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              print("episodes="+",".join(ids),file=f)
              print("matrix="+json.dumps({"episode":ids},separators=(",",":")),file=f)
          PY
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright-core@1.56.1
      - name: Check selection and export controls
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lp-compilation-http.log 2>&1 &
          node tests/little-panth-compilation.cjs
  render:
    needs: [plan,catalogue]
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install render tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg pulseaudio pulseaudio-utils fonts-noto-core
          npm install --no-save --package-lock=false playwright-core@1.56.1
      - name: Render full episode with Punjabi audio
        env:
          EPISODE: ${{ matrix.episode }}
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=lp_export rate=48000
          pactl set-default-sink lp_export
          paplay --device=lp_export --raw --format=s16le --rate=48000 --channels=2 /dev/zero &
          feed=$!
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lp-compilation-http.log 2>&1 &
          server=$!
          trap 'kill "$feed" "$server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:8765/ -o /dev/null && break; sleep 1; done
          node tools/little-panth-compilation-render.cjs "mission-$EPISODE" compilation-renders
      - uses: actions/upload-artifact@v4
        with:
          name: episode-${{ matrix.episode }}
          path: compilation-renders/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
  assemble:
    needs: [plan,render]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: episode-*
          path: compilation-renders
      - name: Assemble one MP4 and chapter timestamps
        env:
          EPISODES: ${{ needs.plan.outputs.episodes }}
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -q && sudo apt-get install -y ffmpeg; fi
          python3 tools/little-panth-compilation-assemble.py compilation-renders release "$EPISODES"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -of compact release/little-panth-compilation.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: little-panth-compilation
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
