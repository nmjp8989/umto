name: Render Little Panth compilation
on:
  workflow_dispatch:
    inputs:
      request:
        description: "Paste the production request copied from the Little Panth tracker"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/little-panth-compilation.yml'
      - 'tools/little-panth-compilation-render.cjs'
      - 'tools/little-panth-compilation-assemble.py'
      - 'tools/little_panth_brand.py'
      - 'tools/little-panth-brand-frames.cjs'
      - 'tests/little-panth-brand.cjs'
      - 'little panth/little-panth-logo.svg'
      - 'little panth/brand-motion.js'
      - 'little panth/brand-bumper.js'
      - 'little panth/render-watermark.js'
      - 'tests/little-panth-compilation.cjs'
      - 'tools/little-panth-production.py'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      name: ${{ steps.plan.outputs.name }}
      episodes: ${{ steps.plan.outputs.episodes }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: Validate production request
        env:
          REQUEST: ${{ inputs.request }}
          EVENT: ${{ github.event_name }}
        run: python3 tools/little-panth-production.py plan
  persist:
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        if: needs.plan.outputs.mode != 'test'
        with:
          ref: main
      - name: Save review decisions and local recording history
        if: needs.plan.outputs.mode != 'test'
        env:
          REQUEST: ${{ inputs.request }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 tools/little-panth-production.py apply
            git add 'little panth/production-db.json'
            git diff --cached --quiet && exit 0
            git commit -m 'Save Little Panth owner review decisions and recording history'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright-core@1.56.1
      - name: Check selection and export controls
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lp-compilation-http.log 2>&1 &
          python3 tests/little-panth-production.py
          node tests/little-panth-brand.cjs
          node tests/little-panth-compilation.cjs
  render:
    needs: [plan,catalogue,persist]
    if: needs.plan.outputs.mode != 'save'
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install render tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg pulseaudio pulseaudio-utils fonts-noto-core
          npm install --no-save --package-lock=false playwright-core@1.56.1
      - name: Render full episode with Punjabi audio
        env:
          EPISODE: ${{ matrix.episode }}
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=lp_export rate=48000
          pactl set-default-sink lp_export
          paplay --device=lp_export --raw --format=s16le --rate=48000 --channels=2 /dev/zero &
          feed=$!
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lp-compilation-http.log 2>&1 &
          server=$!
          trap 'kill "$feed" "$server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:8765/ -o /dev/null && break; sleep 1; done
          node tools/little-panth-compilation-render.cjs "mission-$EPISODE" compilation-renders
      - uses: actions/upload-artifact@v4
        with:
          name: episode-${{ matrix.episode }}
          path: compilation-renders/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
  assemble:
    needs: [plan,render]
    outputs:
      seconds: ${{ steps.assemble.outputs.seconds }}
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: episode-*
          path: compilation-renders
      - id: assemble
        name: Assemble one MP4 and chapter timestamps
        env:
          EPISODES: ${{ needs.plan.outputs.episodes }}
          VOLUME_NAME: ${{ needs.plan.outputs.name }}
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -q && sudo apt-get install -y ffmpeg; fi
          python3 tools/little-panth-compilation-assemble.py compilation-renders release "$EPISODES"
          mv release/little-panth-compilation.mp4 "release/$VOLUME_NAME.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -of compact "release/$VOLUME_NAME.mp4"
          echo "seconds=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "release/$VOLUME_NAME.mp4")" >> "$GITHUB_OUTPUT"
      - id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.name }}
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  record:
    needs: [plan,assemble]
    if: needs.plan.outputs.mode == 'export'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record successful named MP4 in the shared tracker
        env:
          VOLUME_NAME: ${{ needs.plan.outputs.name }}
          EPISODES: ${{ needs.plan.outputs.episodes }}
          VIDEO_SECONDS: ${{ needs.assemble.outputs.seconds }}
          ARTIFACT_ID: ${{ needs.assemble.outputs.artifact }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 tools/little-panth-production.py record
            git add 'little panth/production-db.json'
            git diff --cached --quiet && exit 0
            git commit -m 'Record completed Little Panth MP4 compilation'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
