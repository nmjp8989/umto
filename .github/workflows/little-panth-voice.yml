name: Little Panth Punjabi narration

on:
  workflow_dispatch:
    inputs:
      max_new_lines:
        description: "Max new Punjabi clips to generate (1–100)"
        required: false
        default: "100"
        type: choice
        options: ["1","5","20","50","100"]
  push:
    branches: [main]
    paths:
      - 'little panth/mission-001/dialogue.json'
      - 'tools/build_little_panth_audio.py'
      - '.github/workflows/little-panth-voice.yml'

permissions:
  contents: write

concurrency:
  group: little-panth-voice
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare MP3 encoder
        run: python -m pip install --disable-pip-version-check imageio-ffmpeg
      - name: Generate Punjabi dialogue via Gemini API secret
        id: generation
        env:
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_NEW_LINES: ${{ inputs.max_new_lines || '100' }}
        run: |
          python tools/build_little_panth_audio.py --dry-run --max-new-lines "$MAX_NEW_LINES"
          python tools/build_little_panth_audio.py --max-new-lines "$MAX_NEW_LINES"
      - name: Preserve completed clips as downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: little-panth-punjabi-mission-001
          path: |
            little panth/mission-001/audio/*.mp3
            little panth/mission-001/audio/generation-manifest.json
          if-no-files-found: ignore
      - name: Save generated voice MP3s to the repository
        if: always()
        run: |
          if [ ! -d "little panth/mission-001/audio" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "little panth/mission-001/audio"
          git diff --cached --quiet && exit 0
          git commit -m 'Generate Little Panth Punjabi narration'
          git pull --rebase origin main
          git push origin HEAD:main
