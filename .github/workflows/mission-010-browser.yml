name: Mission 010 Grade 4 browser tests

on:
  push:
    branches: [main]
    paths:
      - 'missions/midnight-math-vault*'
      - 'missions/adventures/midnight-math-vault.json'
      - 'missions/delivery.js'
      - 'tests/missions-010-browser.cjs'
      - '.github/workflows/mission-010-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play-math-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Play and validate the Grade 4 math mission
        run: node tests/missions-010-browser.cjs
