name: Sacha Sauda revised closing narration
on:
  push:
    branches: [sacha-sauda-film]
    paths:
      - '.github/workflows/sacha-sauda-closing-voice.yml'
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check imageio-ffmpeg
      - name: Generate Gemini Punjabi narration for the revised closing
        env:
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for attempt in 1 2; do
            if python tools/build_little_panth_audio.py --mission mission-997 --model gemini-3.8-flash-lite-tts; then exit 0; fi
            if [ "$attempt" -lt 2 ]; then sleep 75; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sacha-sauda-closing-narration
          path: little panth/mission-997/audio/
          if-no-files-found: error
