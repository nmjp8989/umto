<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Umto · Full-body pose review</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf1ee;color:#242b29;font:15px system-ui,sans-serif}header{padding:24px;position:sticky;top:0;background:#edf1eef5;z-index:1;border-bottom:1px solid #ccd5cf}h1{font-size:24px;margin:0 0 8px}p{margin:8px 0;color:#58665e}nav{display:flex;gap:16px;flex-wrap:wrap;align-items:end}label{display:grid;gap:6px;font-size:12px;font-weight:600}select,a{padding:9px;border:1px solid #bccac1;border-radius:8px;background:white;color:#243a2c}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:24px}figure{margin:0;background:#fff;border-radius:12px;border:1px solid #d9e1db;overflow:hidden}figure svg{display:block;width:100%;height:auto;background:#f5f6f3}figcaption{padding:10px;text-align:center;font-size:12px}iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}#status{font-size:12px}a{text-decoration:none}
</style></head><body><header><h1>Full-body pose review</h1><p>Compare the hands, clothing and feet in every pose. The final twelve cards show one complete walking cycle.</p><nav><label>Character<select id="character" disabled></select></label><label>View<select id="view"><option value="front">Front</option><option value="left">Left</option><option value="right">Right</option></select></label><a href="index.html">Open character studio</a></nav><p id="status" role="status">Loading characters…</p></header><main id="grid"></main><iframe id="rig" title="Character renderer" aria-hidden="true" tabindex="-1" src="index.html?poseReview=97.1"></iframe><script>
const frame=document.getElementById('rig'),select=document.getElementById('character'),view=document.getElementById('view'),grid=document.getElementById('grid'),status=document.getElementById('status');let generation=0;
frame.onload=()=>{
 try{
  const w=frame.contentWindow;
  w.eval(`window.poseReview={characters:premadeCharacters.map(p=>({id:p.id,name:p.name})),actions:headshotAnimations.map(a=>[a[0],a[1]]),prepare(id,view){stopDemo();applyPremade(premadeCharacters.find(p=>p.id===id));state.framing='full';cameraView=view;delete svg.dataset.animationFrame;applyColours();render(true);this.torso=document.getElementById('torso').innerHTML;},render(key,time){document.getElementById('torso').innerHTML=this.torso;state.pose='relaxed';if(key.startsWith('stand-')){state.pose=key.slice(6);document.getElementById('torso').innerHTML=bodyRigSvg(state.pose,cameraView,true);reaction.key='neutral';}else reaction.key=key;reaction.playing=true;reaction.started=0;reaction.last='';reactionTick(time*1000);reaction.playing=false;cancelAnimationFrame(reaction.raf);const clone=svg.cloneNode(true);clone.setAttribute('viewBox','-200 -200 1654 2600');clone.removeAttribute('id');clone.querySelector('#background').remove();return clone;}}`);
  for(const p of w.poseReview.characters)select.add(new Option(p.name,p.id));select.value='adult-harpreet';select.disabled=false;
  select.onchange=paint;view.onchange=paint;paint();
 }catch(e){status.textContent='Unable to load character review. Please refresh the page.';console.error(e);}
};
async function paint(){
 const revision=++generation,w=frame.contentWindow,api=w.poseReview;grid.replaceChildren();status.textContent='Rendering poses…';api.prepare(select.value,view.value);
 const cases=[...api.actions.map(([key,label])=>[key,1.3,label]),...['relaxed','straight','wide','hip'].map(p=>['stand-'+p,1.3,'Standing · '+p]),...Array.from({length:12},(_,i)=>['walk',i*.1,'Walk · frame '+(i+1)+' / 12'])];
 for(const [i,[key,time,label]] of cases.entries()){
  if(revision!==generation)return;
  const art=api.render(key,time),prefix='review-'+revision+'-'+i+'-';
  for(const el of art.querySelectorAll('[id]'))el.id=prefix+el.id;
  for(const el of [art,...art.querySelectorAll('*')])for(const attr of [...el.attributes])if(attr.value.includes('url(#'))el.setAttribute(attr.name,attr.value.replace(/url\(#([^)]*)\)/g,(_,id)=>'url(#'+prefix+id+')'));
  const card=document.createElement('figure'),caption=document.createElement('figcaption');caption.textContent=label;art.setAttribute('role','img');art.setAttribute('aria-label',select.selectedOptions[0].text+' · '+label);card.append(document.importNode(art,true),caption);grid.append(card);
  if(i%4===0)await new Promise(resolve=>setTimeout(resolve,0));
 }
 status.textContent=api.characters.length+' characters · '+cases.length+' full-body renders in this view';
}
</script></body></html>
