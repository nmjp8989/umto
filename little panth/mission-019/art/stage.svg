    <image href="../mission-003/art/banyan.webp" x="-58" y="-35" width="1396" height="786" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g id="live-branch" stroke-linecap="round" stroke-linejoin="round">
    <path d="M540 307q31-18 83-16 87 0 133-12 110-25 224-113 55-45 115-41l-7 26q-37 2-95 48-89 80-198 110-104 29-253 15Z"
