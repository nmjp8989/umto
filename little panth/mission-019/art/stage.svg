<svg xmlns="http://www.w3.org/2000/svg" id="stage" viewBox="0 0 1280 720" role="img" aria-labelledby="stage-title">
  <title id="stage-title">A crow with paneer on a branch above a fox in a Punjabi orchard</title>
  <defs>
    <linearGradient id="branch" x2=".33" y2="1">
