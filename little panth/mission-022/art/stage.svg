      <path d="M-53 38Q0 55 54 39M-47 45Q0 61 51 46M-43 52Q1 66 45 53M-36 43l3 13m10-10 3 15m10-10 2 12m12-12v13m13-12-1 12m14-16-2 13m14-16-3 12" fill="none" stroke="#f1c48a" stroke-width="1.8" opacity=".79"/>
