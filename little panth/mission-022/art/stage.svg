      <path d="M-52 30Q-45-2 0 0Q45-2 52 30" fill="none" stroke="#805432" stroke-width="9.2"/>
      <path d="M-51 29Q-44-1 0 0Q44-1 51 29" fill="none" stroke="#ddb074" stroke-width="4.5"/>
      <ellipse cy="30" rx="60" ry="18" fill="#795337" stroke="#94653f" stroke-width="2.7"/>
      <ellipse cy="31" rx="51" ry="13.5" fill="#62472f"/>
