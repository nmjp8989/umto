<svg xmlns="http://www.w3.org/2000/svg" id="stage" viewBox="0 0 1280 720" role="img" aria-labelledby="stage-title">
  <title id="stage-title">Rohan and three monkeys beneath a banyan tree</title>
  <defs>
    <radialGradient id="cap-shade">
      <stop stop-color="#3f3625" stop-opacity=".52"/>
      <stop offset="1" stop-color="#3f3625" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap-bark" x2=".18" y2="1">
      <stop stop-color="#aa814d"/>
      <stop offset=".48" stop-color="#8f6940"/>
      <stop offset="1" stop-color="#5e4833"/>
    </linearGradient>
    <linearGradient id="cap-wicker" x2=".44" y2="1">
      <stop stop-color="#dfaa65"/>
      <stop offset=".57" stop-color="#bf8949"/>
      <stop offset="1" stop-color="#875a3a"/>
    </linearGradient>
    <linearGradient id="cap-stone-fill" x2=".24" y2="1">
      <stop stop-color="#b9a98b"/>
      <stop offset="1" stop-color="#7f6f5b"/>
    </linearGradient>
