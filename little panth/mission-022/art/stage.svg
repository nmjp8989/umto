    <g id="blue-cap" style="--cap-body:#698fba;--cap-visor:#4b729d;--cap-light:#afc9e0;--cap-line:#415873"><use href="#cap-design"/></g>
    <g id="yellow-cap" style="--cap-body:#e8b753;--cap-visor:#c0893d;--cap-light:#f6db97;--cap-line:#825930"><use href="#cap-design"/></g>
    <g id="green-cap" style="--cap-body:#82a365;--cap-visor:#627f52;--cap-light:#c1cc8d;--cap-line:#4b6241"><use href="#cap-design"/></g>
