<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 360" width="928" height="360">
  <defs>
    <!-- Gradients -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF961F" />
      <stop offset="55%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#E64B00" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#228BFF" />
      <stop offset="55%" stop-color="#0E5CE0" />
      <stop offset="100%" stop-color="#07399E" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="50%" stop-color="#FFD93B" />
      <stop offset="100%" stop-color="#FFA200" />
    </linearGradient>

    <linearGradient id="patkaBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D96FF" />
      <stop offset="100%" stop-color="#0A4EC2" />
    </linearGradient>

    <linearGradient id="patkaPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF67A8" />
      <stop offset="100%" stop-color="#D9236F" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE0C8" />
      <stop offset="100%" stop-color="#F7BA94" />
    </linearGradient>

    <!-- Soft Sticker Drop Shadow for White Background -->
    <filter id="stickerShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.22" />
    </filter>

    <!-- Reusable Wordmark Paths -->
    <g id="word-little">
      <!-- L -->
      <path d="M 88,132 C 102,132 108,142 107,156 L 103,228 C 103,234 106,236 113,236 L 132,235 C 143,235 148,244 147,253 C 146,262 138,267 125,267 L 84,267 C 71,267 66,258 67,242 L 72,155 C 73,140 78,132 88,132 Z" />
      <!-- i stem & dot -->
      <path d="M 166,182 C 175,182 180,188 180,198 L 180,251 C 180,261 174,267 166,267 C 157,267 152,261 152,251 L 152,198 C 152,188 157,182 166,182 Z" />
      <circle cx="166" cy="160" r="13.5" />
      <!-- t1 (tip at y=160 for boy head) -->
      <path d="M 216,160 C 226,160 231,166 231,175 L 231,178 L 236,178 C 243,178 247,184 247,191 C 247,198 242,203 235,203 L 231,203 L 231,234 C 231,240 234,242 239,242 C 245,242 249,246 249,253 C 249,261 241,267 228,267 C 209,267 201,257 201,237 L 201,203 L 197,203 C 190,203 186,198 186,191 C 186,184 191,178 198,178 L 201,178 L 201,175 C 201,166 206,160 216,160 Z" />
      <!-- t2 (tip at y=160 for girl head) -->
      <path d="M 280,160 C 290,160 295,166 295,175 L 295,178 L 300,178 C 307,178 311,184 311,191 C 311,198 306,203 299,203 L 295,203 L 295,234 C 295,240 298,242 303,242 C 309,242 313,246 313,253 C 313,261 305,267 292,267 C 273,267 265,257 265,237 L 265,203 L 261,203 C 254,203 250,198 250,191 C 250,184 255,178 262,178 L 265,178 L 265,175 C 265,166 270,160 280,160 Z" />
      <!-- l -->
      <path d="M 337,128 C 347,128 353,135 353,146 L 353,236 C 353,242 356,244 360,244 C 365,244 368,248 368,254 C 368,262 361,267 349,267 C 331,267 322,257 322,238 L 322,146 C 322,135 327,128 337,128 Z" />
      <!-- e -->
      <path fill-rule="evenodd" d="M 403,174 C 425,174 437,191 437,213 C 437,224 431,230 420,230 L 395,230 C 396,239 402,243 411,243 C 418,243 424,240 429,238 C 434,236 439,240 439,247 C 439,257 425,267 405,267 C 380,267 366,248 366,221 C 366,193 381,174 403,174 Z M 402,195 C 395,195 391,201 391,209 L 413,209 C 413,201 409,195 402,195 Z" />
    </g>

    <g id="word-panth">
      <!-- P -->
      <path fill-rule="evenodd" d="M 464,124 L 496,124 C 523,124 538,142 538,170 C 538,198 522,215 494,215 L 481,215 L 481,250 C 481,261 474,267 463,267 C 453,267 446,261 446,250 L 446,142 C 446,130 453,124 464,124 Z M 481,151 L 481,188 L 493,188 C 503,188 508,181 508,170 C 508,158 503,151 493,151 Z" />
      <!-- a -->
      <path fill-rule="evenodd" d="M 570,174 C 583,174 591,179 596,186 C 598,179 603,176 609,176 C 617,176 622,182 622,192 L 622,250 C 622,260 616,267 607,267 C 600,267 595,263 593,256 C 587,263 579,267 569,267 C 548,267 534,248 534,221 C 534,193 549,174 570,174 Z M 577,200 C 567,200 561,209 561,221 C 561,233 567,241 577,241 C 587,241 593,233 593,221 C 593,209 587,200 577,200 Z" />
      <!-- n -->
      <path d="M 646,175 C 653,175 658,179 660,185 C 666,178 674,174 684,174 C 702,174 712,187 712,209 L 712,250 C 712,261 706,267 696,267 C 686,267 680,261 680,250 L 680,213 C 680,204 676,199 670,199 C 664,199 660,205 660,215 L 660,250 C 660,261 654,267 645,267 C 635,267 630,261 630,250 L 630,192 C 630,181 636,175 646,175 Z" />
      <!-- t -->
      <path d="M 742,146 C 752,146 758,153 758,164 L 758,178 L 766,178 C 773,178 777,184 777,191 C 777,198 772,203 765,203 L 758,203 L 758,234 C 758,240 761,242 766,242 C 772,242 776,246 776,253 C 776,261 768,267 755,267 C 736,267 727,257 727,237 L 727,203 L 722,203 C 715,203 711,198 711,191 C 711,184 716,178 723,178 L 727,178 L 727,164 C 727,153 732,146 742,146 Z" />
      <!-- h -->
      <path d="M 796,128 C 806,128 812,135 812,146 L 812,185 C 818,178 826,174 836,174 C 853,174 863,187 863,209 L 863,250 C 863,261 857,267 847,267 C 837,267 831,261 831,250 L 831,213 C 831,204 827,199 821,199 C 815,199 812,205 812,215 L 812,250 C 812,261 806,267 796,267 C 786,267 781,261 781,250 L 781,146 C 781,135 786,128 796,128 Z" />
    </g>

    <!-- Golden Underline Swoosh -->
    <path id="swoosh-shape" d="M 168,308 C 340,264 590,264 762,308 C 769,310 767,320 758,318 C 588,284 342,284 172,318 C 163,320 161,310 168,308 Z" />

    <!-- Sparkle Burst Rays -->
    <g id="sparkle-rays">
      <path d="M 789,112 C 785,112 781,109 779,105 L 770,84 C 768,78 771,72 777,70 C 783,68 789,71 791,77 L 797,100 C 799,106 795,112 789,112 Z" />
      <path d="M 811,111 C 807,109 805,103 807,98 L 819,69 C 822,63 828,60 834,63 C 840,66 842,72 839,78 L 823,106 C 820,111 815,113 811,111 Z" />
      <path d="M 829,124 C 826,120 827,114 832,111 L 856,96 C 862,92 869,94 872,100 C 875,106 873,113 867,116 L 840,127 C 835,129 831,128 829,124 Z" />
    </g>

    <!-- Scaled Small Kids Outer Silhouettes (for uniform white sticker border) -->
    <g id="kids-silhouette">
      <!-- Boy silhouette on t1 -->
      <g transform="translate(216, 145) scale(0.55)" stroke-width="32">
        <ellipse cx="-6" cy="-64" rx="21" ry="17" />
        <ellipse cx="0" cy="-8" rx="45" ry="48" />
        <circle cx="-42" cy="8" r="9" />
        <circle cx="42" cy="8" r="9" />
      </g>
      <!-- Girl silhouette on t2 -->
      <g transform="translate(280, 145) scale(0.55)" stroke-width="32">
        <ellipse cx="0" cy="-7" rx="45" ry="47" />
        <path d="M 33,6 C 48,1 59,12 65,20 C 56,29 41,30 31,20 Z" />
        <circle cx="-42" cy="8" r="9" />
        <circle cx="42" cy="8" r="9" />
      </g>
    </g>
  </defs>

  <!-- 1. Clean White Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- 2. Unified White Sticker Border with Soft Shadow -->
  <g filter="url(#stickerShadow)">
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
      <use href="#kids-silhouette" />
      <use href="#word-little" />
      <use href="#word-panth" />
      <use href="#swoosh-shape" stroke-width="12" />
      <use href="#sparkle-rays" stroke-width="12" />
    </g>
  </g>

  <!-- 3. Wordmark Color Fill -->
  <use href="#word-little" fill="url(#orangeGrad)" />
  <use href="#word-panth" fill="url(#blueGrad)" />

  <!-- 4. Glossy Bubble Highlights on Letters -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.85">
    <path d="M 80,175 L 82,154 C 82,147 85,142 91,141" />
    <path d="M 159,156 C 160,152 163,150 166,150" stroke-width="3.5" />
    <path d="M 331,156 L 331,144 C 331,139 333,136 337,136" stroke-width="3.5" />
    <path d="M 377,204 C 379,192 388,183 400,182" />
    <path d="M 457,170 L 457,145 C 457,138 462,134 470,134 L 485,134" />
    <path d="M 545,204 C 547,192 555,184 566,183" />
    <path d="M 639,198 L 639,189 C 639,185 642,183 646,183" stroke-width="3.5" />
    <path d="M 736,169 L 736,158 C 736,155 738,153 742,153" stroke-width="3.5" />
    <path d="M 790,158 L 790,144 C 790,139 793,136 797,136" stroke-width="4" />
  </g>

  <!-- 5. Golden Swoosh & Sparkle Rays -->
  <use href="#swoosh-shape" fill="url(#goldGrad)" />
  <use href="#sparkle-rays" fill="url(#goldGrad)" />
  <g fill="none" stroke="#FFF4B8" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <path d="M 776,78 L 781,92" />
    <path d="M 824,71 L 816,88" />
    <path d="M 858,103 L 844,111" />
  </g>

  <!-- 6. Small Cute Kids Perched on the Tips of the Two "t"s -->
  <!-- BOY on Tip of t1 -->
  <g transform="translate(216, 145) scale(0.55)" stroke="#24171A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Topknot (Joora) -->
    <ellipse cx="-6" cy="-64" rx="21" ry="17" fill="url(#patkaBlue)" />
    <path d="M -17,-72 C -12,-76 -4,-77 3,-74" fill="none" stroke="#7CC0FF" stroke-width="3" />

    <!-- Ears -->
    <circle cx="-42" cy="8" r="9" fill="url(#skinGrad)" />
    <circle cx="42" cy="8" r="9" fill="url(#skinGrad)" />

    <!-- Face (clean forehead, all hair tucked in) -->
    <path d="M -39,-4 C -39,-32 39,-32 39,-4 C 40,22 22,40 0,40 C -22,40 -39,22 -39,-4 Z" fill="url(#skinGrad)" />

    <!-- Blue Patka wrapping neatly over forehead -->
    <path d="M -43,-3 C -46,-36 -26,-54 0,-54 C 27,-54 46,-35 43,-4 Q 0,-26 -43,-3 Z" fill="url(#patkaBlue)" />
    <path d="M -39,-21 Q 0,-38 39,-21" fill="none" stroke="#083A94" stroke-width="3" />
    <path d="M -30,-37 Q 0,-48 30,-37" fill="none" stroke="#64B3FF" stroke-width="2.5" />

    <!-- Eyebrows & Happy Eyes -->
    <path d="M -24,-10 Q -16,-16 -8,-11" fill="none" stroke="#2B1914" stroke-width="3.8" />
    <path d="M 8,-11 Q 16,-16 24,-10" fill="none" stroke="#2B1914" stroke-width="3.8" />

    <path d="M -23,3 Q -16,-6 -9,3" fill="none" stroke="#24171A" stroke-width="4.4" />
    <path d="M 9,3 Q 16,-6 23,3" fill="none" stroke="#24171A" stroke-width="4.4" />

    <!-- Cheeks, Nose, Smile -->
    <ellipse cx="-25" cy="14" rx="8" ry="4.5" fill="#FF7B75" opacity="0.5" stroke="none" />
    <ellipse cx="25" cy="14" rx="8" ry="4.5" fill="#FF7B75" opacity="0.5" stroke="none" />
    <path d="M -3,7 Q 0,11 3,7" fill="none" stroke="#A65E46" stroke-width="2.6" />

    <path d="M -12,16 Q 0,19 12,16 C 12,28 6,32 0,32 C -6,32 -12,28 -12,16 Z" fill="#591518" stroke-width="3" />
    <path d="M -8,25 C -3,22 3,22 8,25 C 6,30 3,31 0,31 C -3,31 -6,30 -8,25 Z" fill="#FF757F" stroke="none" />
  </g>

  <!-- GIRL on Tip of t2 -->
  <g transform="translate(280, 145) scale(0.55)" stroke="#24171A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Scarf Knot & Tail on Right -->
    <path d="M 33,6 C 48,1 59,12 65,20 C 56,29 41,30 31,20 Z" fill="url(#patkaPink)" />
    <path d="M 40,15 C 47,15 53,18 57,21" fill="none" stroke="#A61452" stroke-width="2.5" />

    <!-- Ears -->
    <circle cx="-42" cy="8" r="9" fill="url(#skinGrad)" />
    <circle cx="42" cy="8" r="9" fill="url(#skinGrad)" />

    <!-- Face (clean forehead, all hair tucked in) -->
    <path d="M -39,-4 C -39,-32 39,-32 39,-4 C 40,22 22,40 0,40 C -22,40 -39,22 -39,-4 Z" fill="url(#skinGrad)" />

    <!-- Pink Headscarf wrapping neatly over forehead -->
    <path d="M -43,-3 C -45,-37 -24,-52 0,-52 C 25,-52 45,-35 43,-4 Q 0,-26 -43,-3 Z" fill="url(#patkaPink)" />
    <path d="M -38,-21 Q 0,-38 38,-21" fill="none" stroke="#AD1756" stroke-width="3" />
    <path d="M -28,-37 Q 0,-47 28,-37" fill="none" stroke="#FF9BC4" stroke-width="2.5" />

    <!-- Eyebrows & Happy Eyes -->
    <path d="M -24,-10 Q -16,-16 -8,-11" fill="none" stroke="#2B1914" stroke-width="3.8" />
    <path d="M 8,-11 Q 16,-16 24,-10" fill="none" stroke="#2B1914" stroke-width="3.8" />

    <path d="M -23,3 Q -16,-6 -9,3" fill="none" stroke="#24171A" stroke-width="4.4" />
    <path d="M 9,3 Q 16,-6 23,3" fill="none" stroke="#24171A" stroke-width="4.4" />

    <!-- Cheeks, Nose, Smile -->
    <ellipse cx="-25" cy="14" rx="8" ry="4.5" fill="#FF7B75" opacity="0.5" stroke="none" />
    <ellipse cx="25" cy="14" rx="8" ry="4.5" fill="#FF7B75" opacity="0.5" stroke="none" />
    <path d="M -3,7 Q 0,11 3,7" fill="none" stroke="#A65E46" stroke-width="2.6" />

    <path d="M -12,16 Q 0,19 12,16 C 12,28 6,32 0,32 C -6,32 -12,28 -12,16 Z" fill="#591518" stroke-width="3" />
    <path d="M -8,25 C -3,22 3,22 8,25 C 6,30 3,31 0,31 C -3,31 -6,30 -8,25 Z" fill="#FF757F" stroke="none" />
  </g>
</svg>