<svg xmlns="http://www.w3.org/2000/svg" id="stage" viewBox="0 0 1280 720" role="img" aria-labelledby="stage-title">
  <title id="stage-title">The crow looks for water in a sunny Punjabi village</title>
  <defs>
    <linearGradient id="feathers" x2=".8" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#536372"/><stop offset=".46" stop-color="#354553"/><stop offset="1" stop-color="#202a38"/>
    </linearGradient>
    <linearGradient id="wing-color" x2=".7" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#596f7a"/><stop offset=".46" stop-color="#3e5364"/><stop offset="1" stop-color="#26323f"/>
    </linearGradient>
    <linearGradient id="beak-color" x2=".4" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#636671"/><stop offset=".52" stop-color="#484b58"/><stop offset="1" stop-color="#272e3b"/>
    </linearGradient>
    <linearGradient id="terracotta" x2="1" y2=".04" gradientUnits="objectBoundingBox">
      <stop stop-color="#914a3a"/><stop offset=".23" stop-color="#bf6648"/><stop offset=".54" stop-color="#dfa372"/><stop offset="1" stop-color="#aa533b"/>
    </linearGradient>
    <linearGradient id="inside-pot" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#7d4b40"/><stop offset=".6" stop-color="#a76851"/><stop offset="1" stop-color="#864536"/>
    </linearGradient>
    <linearGradient id="water-color" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#8bd1cf"/><stop offset=".5" stop-color="#529db0"/><stop offset="1" stop-color="#387882"/>
    </linearGradient>
    <radialGradient id="ground-shadow">
      <stop stop-color="#4f342e" stop-opacity=".42"/><stop offset="1" stop-color="#4f342e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette">
      <stop offset=".61" stop-color="#63401a" stop-opacity="0"/><stop offset="1" stop-color="#4c3928" stop-opacity=".19"/>
    </radialGradient>
    <clipPath id="pot-interior">
      <path d="M790 450q30 6 59 0l4 22q10 13 29 27 26 18 26 61 2 61-62 75-25 6-54 0-66-12-66-74 1-42 28-62 24-18 31-32Z"/>
    </clipPath>
    <g id="small-stone">
      <path d="M-10 2q1-9 9-10 11-1 14 6 2 6-5 8-12 2-18-4Z" fill="currentColor" stroke="#655d50" stroke-width="1.65"/>
      <path d="M-6-2q5-5 12-2" fill="none" stroke="#fff4d3" opacity=".53" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </defs>

  <g id="world">
    <image id="fields" href="art/fields.svg" x="0" y="0" width="1280" height="720"/>
    <image id="courtyard" href="art/courtyard.svg" x="0" y="0" width="1280" height="720" opacity="0"/>
  </g>
  <g id="heat-lines" fill="none" stroke="#fff0ba" stroke-width="3" stroke-linecap="round" opacity=".55">
    <path d="M587 493q18-12 37-4t39-4"/><path d="M478 528q25-16 45-4t42-3"/><path d="M1015 511q23-13 51-5t42-8"/>
  </g>

  <g id="props" opacity="0">
    <ellipse cx="831" cy="647" rx="145" ry="28" fill="url(#ground-shadow)"/>
    <ellipse cx="819" cy="644" rx="72" ry="8" fill="#8a5b46" opacity=".64"/>
    <path d="M773 445q45-7 94 0l-6 24q8 13 27 27 37 26 37 74 2 68-69 79-42 7-77-1-69-15-69-76 1-47 35-76 22-17 30-31Z" fill="url(#terracotta)" stroke="#773d31" stroke-width="5" stroke-linejoin="round"/>
    <g id="jar-decoration">
      <path d="M734 514q68 28 170-2M720 545q95 46 199 0m-201 19q101 42 203-1m-186 56q86 35 164 0" fill="none" stroke="#8c4e3b" stroke-width="3.3" opacity=".6"/>
      <path d="M736 523q80 39 167-1m-183 32q88 40 198 0m-188 35q91 36 184-2" fill="none" stroke="#f3bc87" stroke-width="3.4" opacity=".82"/>
      <path d="m744 584 14-7 15 14 17-7 19 13 17-10 19 8 18-13 17 4 17-12" stroke="#fff1b9" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".86"/>
      <path d="M765 505q-26 27-24 66m103-97q22 9 33 21m-5 129q13-6 23-18" stroke="#ffc495" stroke-width="5" fill="none" stroke-linecap="round" opacity=".44"/>
    </g>
    <g id="jar-cutaway" opacity="0">
      <path d="M790 450q30 6 59 0l4 22q10 13 29 27 26 18 26 61 2 61-62 75-25 6-54 0-66-12-66-74 1-42 28-62 24-18 31-32Z" fill="url(#inside-pot)" stroke="#f3b687" stroke-width="4.5" stroke-linejoin="round"/>
      <g clip-path="url(#pot-interior)">
        <g id="water-level" transform="translate(0 615)">
          <path d="M718 1q22-8 52-1t48 0 43 0 55 0v175H718Z" fill="url(#water-color)"/>
          <path d="M718 1q22-8 52-1t48 0 43 0 55 0" fill="none" stroke="#cef2e2" stroke-width="3.2" opacity=".92"/>
          <path d="M758 12q16-4 31 1m53-2q23-5 40 0M785 26q29 7 49 0" fill="none" stroke="#ade7dc" stroke-width="2" opacity=".54" stroke-linecap="round"/>
          <ellipse id="water-ripple" cx="820" cy="4" rx="0" ry="0" fill="none" opacity="0" stroke="#effcf0" stroke-width="2.5"/>
        </g>
        <g id="submerged-stones">
          <use href="#small-stone" x="807" y="630" color="#728f88" opacity="0"/>
          <use href="#small-stone" x="829" y="631" color="#87a393" opacity="0"/>
          <use href="#small-stone" x="846" y="626" color="#72968e" opacity="0"/>
          <use href="#small-stone" x="820" y="621" color="#9ca28b" opacity="0"/>
        </g>
      </g>
      <path d="M755 505q-29 30-27 62 0 39 35 59m120-119q26 29 26 60-2 38-31 53" fill="none" stroke="#f5bb8a" stroke-width="3" opacity=".45" stroke-linecap="round"/>
    </g>
    <ellipse cx="820" cy="449" rx="50" ry="13" fill="#684237" stroke="#9f5d45" stroke-width="5"/>
    <ellipse cx="820" cy="446" rx="49" ry="12" fill="none" stroke="#eeb186" stroke-width="5"/>
    <path d="M772 451q46 19 95 0" stroke="#e4a477" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g id="stone-pile">
      <ellipse cx="684" cy="630" rx="81" ry="13" fill="url(#ground-shadow)"/>
      <use href="#small-stone" x="640" y="619" color="#b0a38f" transform="rotate(-12 640 619)"/>
      <use href="#small-stone" x="667" y="626" color="#c9b797" transform="rotate(8 667 626)"/>
      <use href="#small-stone" x="689" y="611" color="#9d967f" transform="rotate(-12 689 611)"/>
      <use href="#small-stone" x="714" y="623" color="#bea38b" transform="rotate(14 714 623)"/>
    </g>
    <use id="falling-stone" href="#small-stone" color="#c6ac8d" opacity="0"/>
    <g id="splash" fill="#b5e4d9" opacity="0">
      <ellipse cx="-17" cy="-11" rx="3" ry="5" transform="rotate(-28 -17 -11)"/>
      <ellipse cx="14" cy="-18" rx="3" ry="6" transform="rotate(26 14 -18)"/>
      <ellipse cx="0" cy="-26" rx="2.7" ry="5.9"/>
    </g>
  </g>

  <ellipse id="crow-shadow" cx="0" cy="0" rx="75" ry="19" fill="url(#ground-shadow)"/>
  <g id="crow" data-speaking="false" stroke-linejoin="round" stroke-linecap="round">
    <g id="wing-far" opacity="0">
      <path d="M-20-75q-22-8-51-41-31-34-35-63 25 9 42 39-7-22-2-32 23 16 31 42 22 3 39 34Z" fill="#364757" stroke="#222d3c" stroke-width="4.5"/>
    </g>
    <path id="tail" d="M-49-74q-46 5-97 24 9 9 36 8-22 4-23 12 33 8 83-8Z" fill="#334352" stroke="#242e3a" stroke-width="4.5"/>
    <g id="crow-legs" fill="none" stroke="#484151" stroke-width="5.5">
      <path d="M-26-31q8 16 5 30m-2 0q13 0 20-3m-18 3q9-5 10-9"/>
      <path d="M10-28q3 12 1 27m1 1q14 2 21-1m-22 1q8-6 16-7m-17 6q-8 1-13 5"/>
    </g>
    <path d="M-72-76q14-41 65-44 36-6 57 15 27 22 17 47-11 32-62 35-48 0-76-22-15-13-1-31Z" fill="url(#feathers)" stroke="#232e3d" stroke-width="5"/>
    <path d="M-57-54q43 32 86 16 23-8 31-21-5 31-51 37-43 3-66-32Z" fill="#263341" opacity=".7"/>
    <g id="wing-near">
      <path d="M9-106q-24-10-54 7-8 6-5 18-17 24-37 36 13 4 28-1-1 6-12 12 26 5 42-9 5 6 16 0 12-7 25-22 17-25-3-41Z" fill="url(#wing-color)" stroke="#263441" stroke-width="4.5"/>
      <path d="M-2-98q-19-5-33 6m20 7q-14 8-23 21m-6 8q-13 12-22 14m35-5q11-7 25-22" fill="none" stroke="#83919a" stroke-width="2.5" opacity=".66"/>
    </g>
    <g id="crow-head" transform="translate(39 -103)">
      <path d="M-29 8q-3-28 17-46 6-5 17-9-5-5-15-9 16-4 28 2 2-9 0-15 16 9 18 17 25 2 35 23 6 15 0 32-6 28-38 36-26 6-45-5-15-9-17-26Z" fill="url(#feathers)" stroke="#222e3a" stroke-width="4.5"/>
      <path d="M-15-18q6-20 24-25 17-6 32-2" fill="none" stroke="#81929a" stroke-width="2.8" opacity=".82"/>
      <path d="M-16 17q-4 18 25 20 21 2 35-9-27 5-48-12Z" fill="#293946" opacity=".64"/>
      <g id="crow-eye">
        <ellipse cx="37" cy="-14" rx="20" ry="18" fill="#fdf3d3" stroke="#263441" stroke-width="3.8"/>
        <ellipse id="crow-pupil" cx="45" cy="-13" rx="8.7" ry="10.8" fill="#273340"/>
        <circle id="crow-glint" cx="47.6" cy="-17.5" r="2.9" fill="#fff9e6"/>
      </g>
      <path id="eyelid" d="M22-15q14 11 30 1" fill="none" stroke="#24303d" stroke-width="3.6" opacity="0"/>
      <path id="brow" d="M24-37q14-9 28-1" fill="none" stroke="#293744" stroke-width="4.5"/>
      <path d="M45 7q31-8 56 9-22 18-57 8Z" fill="#432f3a"/>
      <g id="lower-beak">
        <path d="M49 13q31 14 54 3-6 16-29 19-20 2-29-11Z" fill="url(#beak-color)" stroke="#26313e" stroke-width="3.5"/>
        <path d="M60 23q18 8 31 0" fill="none" stroke="#6d7378" stroke-width="2" opacity=".72"/>
      </g>
      <path d="M48 3q22-12 47 3 11 6 10 11-12 9-32 6-12-1-29-7-4-9 4-13Z" fill="url(#beak-color)" stroke="#242e3a" stroke-width="3.5"/>
      <path d="M53 3q17-6 31 1" fill="none" stroke="#85878a" stroke-width="2.5" opacity=".7"/>
      <ellipse cx="67" cy="6.4" rx="2.5" ry="1.5" fill="#282d3a"/>
      <use id="carried-stone" href="#small-stone" x="99" y="22" color="#c7ad8b" opacity="0" transform="translate(23 3) scale(.76)"/>
    </g>
  </g>

  <path d="M0 0h1280v720H0z" fill="url(#vignette)" pointer-events="none"/>
</svg>
