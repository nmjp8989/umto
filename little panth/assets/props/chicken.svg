<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 157 330 245" width="330" height="245">
<defs>
    <!-- Shared Gradients Matching bullock-cart.svg -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcfaff"/>
      <stop offset="100%" stop-color="#f2ecfa"/>
    </linearGradient>

    <linearGradient id="wheatGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe761"/>
      <stop offset="60%" stop-color="#f5be2e"/>
      <stop offset="100%" stop-color="#cc8b14"/>
    </linearGradient>

    <linearGradient id="sackGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffe18c"/>
      <stop offset="55%" stop-color="#f2be57"/>
      <stop offset="100%" stop-color="#cc8d2b"/>
    </linearGradient>

    <linearGradient id="woodHandle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e38d3b"/>
      <stop offset="100%" stop-color="#8c4514"/>
    </linearGradient>

    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cfd8de"/>
      <stop offset="100%" stop-color="#8b99a3"/>
    </linearGradient>

    <linearGradient id="oxGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="65%" stop-color="#f7ead4"/>
      <stop offset="100%" stop-color="#e3c8a1"/>
    </linearGradient>

    <linearGradient id="hornGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9e6642"/>
      <stop offset="100%" stop-color="#59331d"/>
    </linearGradient>

    <linearGradient id="bellGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffea61"/>
      <stop offset="55%" stop-color="#f5b81d"/>
      <stop offset="100%" stop-color="#c47e0e"/>
    </linearGradient>

    <linearGradient id="chickenGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="55%" stop-color="#f7b754"/>
      <stop offset="100%" stop-color="#cf7129"/>
    </linearGradient>

    <linearGradient id="basketGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0b654"/>
      <stop offset="55%" stop-color="#d48e32"/>
      <stop offset="100%" stop-color="#9e6019"/>
    </linearGradient>

    <!-- Reusable Wheat Stalk for Patch -->
    <g id="patchStalk" stroke="#1f140d" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0,0 Q-3,-55 4,-112" fill="none" stroke="#c98912" stroke-width="3.2"/>
      <path d="M0,0 Q-3,-55 4,-112" fill="none" stroke="#1f140d" stroke-width="1.6"/>
      <path d="M-1,-22 Q-18,-50 -14,-78 Q-6,-54 0,-32 Z" fill="#e6a81c" stroke-width="2"/>
      <path d="M1,-36 Q16,-62 18,-86 Q7,-62 1,-44 Z" fill="#ffd238" stroke-width="2"/>
      <g fill="#ffd238" stroke-width="2">
        <ellipse cx="-2" cy="-112" rx="4.2" ry="7" transform="rotate(-22 -2 -112)"/>
        <ellipse cx="8" cy="-116" rx="4.2" ry="7" transform="rotate(22 8 -116)"/>
        <ellipse cx="-1" cy="-124" rx="4.2" ry="7" transform="rotate(-20 -1 -124)"/>
        <ellipse cx="9" cy="-128" rx="4.2" ry="7" transform="rotate(20 9 -128)"/>
        <ellipse cx="1" cy="-136" rx="3.8" ry="6.5" transform="rotate(-14 1 -136)"/>
        <ellipse cx="10" cy="-138" rx="3.8" ry="6.5" transform="rotate(14 10 -138)"/>
        <ellipse cx="6" cy="-147" rx="3.5" ry="6" transform="rotate(6 6 -147)"/>
      </g>
      <path d="M6,-153 L10,-168 M-1,-138 L-8,-152 M11,-138 L18,-150" fill="none" stroke-width="1.5"/>
    </g>
  </defs>
<g id="asset-chicken" transform="translate(185, 290)">
      <ellipse id="chicken-shadow" cx="4" cy="76" rx="56" ry="11" fill="#b38c68" opacity="0.35"/>

      <!-- Legs (pivot at top hip for walking/running) -->
      <g id="chicken-legs" stroke="#1f140d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-8,28 L-14,68 M-14,68 L-30,72 M-14,68 L-12,76 M-14,68 L-2,74" fill="none" stroke="#e89a25" stroke-width="5"/>
        <path d="M-8,28 L-14,68 M-14,68 L-30,72 M-14,68 L-12,76 M-14,68 L-2,74" fill="none" stroke="#1f140d" stroke-width="1.8"/>
        <path d="M16,28 L12,72 M12,72 L-4,76 M12,72 L14,80 M12,72 L24,78" fill="none" stroke="#f5b338" stroke-width="5"/>
        <path d="M16,28 L12,72 M12,72 L-4,76 M12,72 L14,80 M12,72 L24,78" fill="none" stroke="#1f140d" stroke-width="1.8"/>
      </g>

      <!-- Tail Feathers -->
      <g id="chicken-tail" stroke="#1f140d" stroke-width="2.4" stroke-linejoin="round">
        <path d="M36,-10 Q74,-48 92,-34 Q76,-16 54,-6 Q84,-22 96,-6 Q74,6 46,10 Z" fill="#cf6721"/>
        <path d="M40,-4 Q72,-32 82,-22 Q64,-10 44,0 Z" fill="#f5a73b" stroke="none"/>
      </g>

      <!-- Plump Chicken Body -->
      <path id="chicken-body" d="M-54,-8 C-60,36 -18,52 24,42 C58,34 62,-8 44,-22 C24,-34 -32,-38 -54,-8 Z" fill="url(#chickenGrad)" stroke="#1f140d" stroke-width="2.5"/>

      <!-- Flapping Wing (pivot at -10, -4) -->
      <path id="chicken-wing" d="M-14,-8 C12,-14 38,0 32,20 C24,32 -12,28 -22,12 C-26,2 -22,-6 -14,-8 Z" fill="#f09d38" stroke="#1f140d" stroke-width="2.2"/>

      <!-- Chicken Head & Comb (pivot at -38, -24) -->
      <g id="chicken-head" transform="translate(-38, -24)" stroke="#1f140d" stroke-width="2.4" stroke-linejoin="round">
        <!-- Red Comb -->
        <path d="M-12,-40 Q-16,-62 -4,-54 Q4,-68 14,-52 Q24,-60 22,-42 Q12,-34 -12,-40 Z" fill="#e62b25"/>
        <!-- Neck & Head -->
        <path d="M-24,18 Q-28,-24 -12,-40 Q6,-50 22,-36 Q32,-20 22,14 Z" fill="#fff3d6"/>
        <!-- Red Wattle -->
        <path d="M-24,-10 Q-34,4 -22,10 Q-14,6 -16,-8 Z" fill="#e62b25"/>
        <!-- Beak (open slightly for squawking!) -->
        <polygon points="-22,-22 -46,-16 -24,-8" fill="#ffb81c"/>
        <!-- Eye -->
        <circle cx="-8" cy="-24" r="5" fill="#1f140d" stroke="none"/>
        <circle cx="-9.5" cy="-25.5" r="1.8" fill="#ffffff" stroke="none"/>
      </g>

      <!-- Panic Feathers & Squawk FX (toggle opacity="1" on crash) -->
      <g id="chicken-panic-fx" opacity="0">
        <path d="M-84,-68 L-98,-78 M-88,-54 L-106,-58 M-82,-40 L-96,-34" stroke="#e62b25" stroke-width="2.8" stroke-linecap="round"/>
        <path d="M58,-64 Q72,-74 78,-60 Q68,-54 58,-64 Z" fill="#fff3d6" stroke="#1f140d" stroke-width="1.6"/>
        <path d="M88,-38 Q104,-42 104,-28 Q94,-26 88,-38 Z" fill="#f7b754" stroke="#1f140d" stroke-width="1.6"/>
      </g>
    </g>
</svg>
