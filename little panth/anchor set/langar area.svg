<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Bright, Mellow Indoor Ambient Gradients -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffcf7"/>
      <stop offset="100%" stop-color="#f2e6d8"/>
    </linearGradient>

    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf3eb"/>
      <stop offset="55%" stop-color="#f2e3d3"/>
      <stop offset="100%" stop-color="#e8d2bc"/>
    </linearGradient>

    <linearGradient id="ceilingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d6c1"/>
      <stop offset="100%" stop-color="#f7ede1"/>
    </linearGradient>

    <linearGradient id="kitchenWarmGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="100%" stop-color="#f2dec2"/>
    </linearGradient>

    <linearGradient id="washTileGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6f7"/>
      <stop offset="100%" stop-color="#dbe9eb"/>
    </linearGradient>

    <linearGradient id="steelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b5c0c7"/>
      <stop offset="40%" stop-color="#eef4f7"/>
      <stop offset="75%" stop-color="#cfd8de"/>
      <stop offset="100%" stop-color="#9aa6ad"/>
    </linearGradient>

    <radialGradient id="mellowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d6" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#fff4c2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fff4c2" stop-opacity="0"/>
    </radialGradient>

    <!-- Tile Grid Pattern for Washing Area -->
    <pattern id="washTiles" width="24" height="18" patternUnits="userSpaceOnUse">
      <rect width="24" height="18" fill="none" stroke="#bdd1d4" stroke-width="0.9"/>
    </pattern>

    <!-- Tile Grid Pattern for Kitchen Interior -->
    <pattern id="kitchenTiles" width="26" height="18" patternUnits="userSpaceOnUse">
      <rect width="26" height="18" fill="none" stroke="#e6cfb3" stroke-width="0.9"/>
    </pattern>

    <!-- Golden Khanda Emblem -->
    <g id="khandaGold" fill="none" stroke="#ffd24c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="8"/>
      <line x1="0" y1="-13" x2="0" y2="13"/>
      <path d="M-9,-7 C-14,0 -10,9 -2,11.5"/>
      <path d="M9,-7 C14,0 10,9 2,11.5"/>
    </g>

    <!-- Warm Pendant Ceiling Lamp -->
    <g id="warmLamp">
      <circle cx="0" cy="18" r="95" fill="url(#mellowGlow)"/>
      <line x1="0" y1="-60" x2="0" y2="0" stroke="#8c6b4f" stroke-width="2.2"/>
      <path d="M-16,12 Q0,-4 16,12 Z" fill="#e6b042" stroke="#855f23" stroke-width="1.2"/>
      <ellipse cx="0" cy="14" rx="11" ry="5" fill="#fffbe0"/>
    </g>

    <!-- Chrome / Steel Water Tap -->
    <g id="waterTap" stroke="#526069" stroke-width="1.2" stroke-linejoin="round">
      <rect x="-5" y="0" width="10" height="8" rx="2" fill="#cfd8de"/>
      <path d="M0,0 L0,-16 Q0,-22 8,-22 Q15,-22 15,-14 L15,-10" fill="none" stroke="#b5c0c7" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M0,0 L0,-16 Q0,-22 8,-22 Q15,-22 15,-14 L15,-10" fill="none" stroke="#526069" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="-6" y1="-10" x2="6" y2="-10" stroke="#7d8c94" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- 1. INDOOR BACK WALL -->
  <rect x="0" y="54" width="1280" height="390" fill="url(#wallGrad)"/>

  <!-- 2. LEFT BAY: KITCHEN SERVING WINDOWS (LANGAR KITCHEN) -->
  <g id="kitchen-windows-area">
    <!-- Arch Frame on Left -->
    <path d="M92,444 L92,202 Q100,156 156,142 Q196,120 245,104 Q294,120 334,142 Q390,156 398,202 L398,444 Z" fill="#f5eadc" stroke="#9e8770" stroke-width="1.4"/>
    <path d="M84,210 Q94,154 152,138 Q194,114 245,96 Q296,114 338,138 Q396,154 406,210 L394,210 Q384,162 332,146 Q292,124 245,108 Q198,124 158,146 Q106,162 96,210 Z" fill="#f0b63a" stroke="#9c7322" stroke-width="1"/>

    <!-- Warmly Lit Kitchen Interior Behind Serving Windows -->
    <rect x="112" y="198" width="266" height="148" fill="url(#kitchenWarmGrad)" stroke="#9e8264" stroke-width="1.4"/>
    <rect x="112" y="198" width="266" height="148" fill="url(#kitchenTiles)"/>
    <!-- Soft Kitchen Ceiling Light Glow -->
    <ellipse cx="245" cy="218" rx="110" ry="34" fill="#fff9db" opacity="0.65"/>

    <!-- Kitchen Back Wall Shelf with Steel Containers -->
    <rect x="128" y="238" width="234" height="6" fill="#c79e72" stroke="#856340" stroke-width="1"/>
    <g stroke="#5e6b73" stroke-width="1.1">
      <rect x="142" y="216" width="22" height="22" rx="2" fill="url(#steelGrad)"/>
      <rect x="172" y="212" width="26" height="26" rx="2" fill="url(#steelGrad)"/>
      <rect x="206" y="220" width="20" height="18" rx="2" fill="url(#steelGrad)"/>
      <rect x="292" y="214" width="24" height="24" rx="2" fill="url(#steelGrad)"/>
      <rect x="324" y="218" width="22" height="20" rx="2" fill="url(#steelGrad)"/>
    </g>

    <!-- Large Steel Langar Pots (Patilas) & Ladles inside Serving Window -->
    <g stroke="#526069" stroke-width="1.2">
      <!-- Pot 1 -->
      <rect x="136" y="302" width="54" height="38" rx="3" fill="url(#steelGrad)"/>
      <ellipse cx="163" cy="302" rx="27" ry="5" fill="#eef4f7"/>
      <line x1="176" y1="302" x2="192" y2="274" stroke="#6d7b82" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Pot 2 -->
      <rect x="206" y="306" width="50" height="34" rx="3" fill="url(#steelGrad)"/>
      <ellipse cx="231" cy="306" rx="25" ry="4.5" fill="#eef4f7"/>
      <line x1="220" y1="306" x2="208" y2="280" stroke="#6d7b82" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Stacked Steel Thalis Ready to Serve -->
      <g transform="translate(324, 336)">
        <ellipse cx="0" cy="0" rx="24" ry="4.5" fill="#b5c0c7"/>
        <ellipse cx="0" cy="-4" rx="24" ry="4.5" fill="#cfd8de"/>
        <ellipse cx="0" cy="-8" rx="24" ry="4.5" fill="#e1e8ed"/>
        <ellipse cx="0" cy="-12" rx="24" ry="4.5" fill="#f2f6f9"/>
      </g>
    </g>

    <!-- Wooden / Brass Window Divider & Mullions (Two Serving Windows) -->
    <rect x="238" y="198" width="14" height="148" fill="#a86834" stroke="#6b3e1a" stroke-width="1.2"/>
    <rect x="112" y="198" width="266" height="8" fill="#a86834" stroke="#6b3e1a" stroke-width="1.2"/>

    <!-- Polished Granite / Marble Serving Counter Ledge -->
    <rect x="100" y="344" width="290" height="12" rx="2" fill="#e0d2c3" stroke="#85715c" stroke-width="1.3"/>
    <!-- Lower Wall Panel Below Counter -->
    <rect x="108" y="356" width="274" height="88" fill="#efe2d3" stroke="#9e8770" stroke-width="1.2"/>
    <rect x="126" y="370" width="110" height="58" fill="#f7ede1" stroke="#c4af99" stroke-width="1.1"/>
    <rect x="254" y="370" width="110" height="58" fill="#f7ede1" stroke="#c4af99" stroke-width="1.1"/>
  </g>

  <!-- 3. CENTER BAY: CLEAN MARBLE ARCH, WALL SCONCES & "ਲੰਗਰ ਹਾਲ" PLAQUE -->
  <g id="center-hall-bay">
    <!-- Royal Blue & Gold Plaque -->
    <g transform="translate(640, 102)">
      <path d="M-142,-17 Q-128,-17 -120,-24 L120,-24 Q128,-17 142,-17 L156,0 L142,17 Q128,17 120,24 L-120,24 Q-128,17 -142,17 L-156,0 Z" fill="#f5b832" stroke="#855f23" stroke-width="1.2"/>
      <path d="M-138,-14 Q-125,-14 -117,-20 L117,-20 Q125,-14 138,-14 L150,0 L138,14 Q125,14 117,20 L-117,20 Q-125,14 -138,14 L-150,0 Z" fill="#0f3e96"/>
      <use href="#khandaGold" x="-112" y="0"/>
      <use href="#khandaGold" x="112" y="0"/>
      <text x="0" y="9" text-anchor="middle" font-family="'Noto Sans Gurmukhi', 'Raavi', 'Gurmukhi MN', sans-serif" font-size="26" font-weight="bold" fill="#ffffff">ਲੰਗਰ ਹਾਲ</text>
    </g>

    <!-- Graceful Center Marble Arch -->
    <path d="M475,444 L475,244 Q488,196 554,180 Q594,158 640,140 Q686,158 726,180 Q792,196 805,244 L805,444 Z" fill="#faf4eb" stroke="#9e8770" stroke-width="1.4"/>
    <path d="M466,252 Q480,192 550,176 Q592,150 640,132 Q688,150 730,176 Q800,192 814,252 L800,252 Q788,202 724,184 Q684,160 640,142 Q596,160 556,184 Q492,202 480,252 Z" fill="#f0b63a" stroke="#9c7322" stroke-width="1.1"/>

    <!-- Recessed Warm Cream Marble Wall & Wooden Double Doors -->
    <path d="M518,444 L518,262 Q528,224 576,212 Q606,194 640,180 Q674,194 704,212 Q752,224 762,262 L762,444 Z" fill="#f2e6d8" stroke="#b09982" stroke-width="1.2"/>
    <!-- Wooden Double Doors inside Center Arch -->
    <path d="M578,444 L578,298 Q604,274 640,262 Q676,274 702,298 L702,444 Z" fill="#a86432" stroke="#633818" stroke-width="1.5"/>
    <line x1="640" y1="262" x2="640" y2="444" stroke="#633818" stroke-width="2"/>
    <rect x="592" y="324" width="36" height="50" rx="2" fill="#945427" stroke="#633818" stroke-width="1"/>
    <rect x="652" y="324" width="36" height="50" rx="2" fill="#945427" stroke="#633818" stroke-width="1"/>
    <rect x="592" y="384" width="36" height="44" rx="2" fill="#945427" stroke="#633818" stroke-width="1"/>
    <rect x="652" y="384" width="36" height="44" rx="2" fill="#945427" stroke="#633818" stroke-width="1"/>
    <circle cx="631" cy="378" r="4.5" fill="none" stroke="#ffd24c" stroke-width="2"/>
    <circle cx="649" cy="378" r="4.5" fill="none" stroke="#ffd24c" stroke-width="2"/>
    <!-- Low Marble Threshold Step -->
    <rect x="562" y="436" width="156" height="8" fill="#ffffff" stroke="#9e8770" stroke-width="1.1"/>

    <!-- Warm Wall Dado across Center Pillars -->
    <rect x="0" y="384" width="84" height="60" fill="#ebe0d1" stroke="#b09982" stroke-width="1"/>
    <rect x="406" y="384" width="69" height="60" fill="#ebe0d1" stroke="#b09982" stroke-width="1"/>
    <rect x="805" y="384" width="69" height="60" fill="#ebe0d1" stroke="#b09982" stroke-width="1"/>
    <rect x="1196" y="384" width="84" height="60" fill="#ebe0d1" stroke="#b09982" stroke-width="1"/>
  </g>

  <!-- 4. RIGHT BAY: DISH & HAND WASHING AREA -->
  <g id="washing-area">
    <!-- Arch Frame on Right -->
    <path d="M882,444 L882,202 Q890,156 946,142 Q986,120 1035,104 Q1084,120 1124,142 Q1180,156 1188,202 L1188,444 Z" fill="#f5eadc" stroke="#9e8770" stroke-width="1.4"/>
    <path d="M874,210 Q884,154 942,138 Q984,114 1035,96 Q1086,114 1128,138 Q1186,154 1196,210 L1184,210 Q1174,162 1122,146 Q1082,124 1035,108 Q988,124 948,146 Q896,162 886,210 Z" fill="#f0b63a" stroke="#9c7322" stroke-width="1"/>

    <!-- Clean Tiled Backsplash inside Washing Bay -->
    <path d="M902,344 L902,216 Q912,174 960,160 Q994,140 1035,126 Q1076,140 1110,160 Q1158,174 1168,216 L1168,344 Z" fill="url(#washTileGrad)" stroke="#8ca3a6" stroke-width="1.2"/>
    <path d="M902,344 L902,216 Q912,174 960,160 Q994,140 1035,126 Q1076,140 1110,160 Q1158,174 1168,216 L1168,344 Z" fill="url(#washTiles)"/>

    <!-- Upper Steel Drying Rack with Clean Stacked Thalis & Glasses -->
    <rect x="920" y="236" width="230" height="5" fill="#b5c0c7" stroke="#526069" stroke-width="1"/>
    <!-- Clean Thalis on Rack -->
    <g stroke="#526069" stroke-width="1" fill="url(#steelGrad)">
      <ellipse cx="948" cy="222" rx="5" ry="14"/>
      <ellipse cx="957" cy="222" rx="5" ry="14"/>
      <ellipse cx="966" cy="222" rx="5" ry="14"/>
      <ellipse cx="975" cy="222" rx="5" ry="14"/>
      <ellipse cx="984" cy="222" rx="5" ry="14"/>
      <ellipse cx="993" cy="222" rx="5" ry="14"/>
      <!-- Clean Steel Glasses -->
      <polygon points="1076,220 1090,220 1088,236 1078,236"/>
      <polygon points="1096,220 1110,220 1108,236 1098,236"/>
      <polygon points="1116,220 1130,220 1128,236 1118,236"/>
    </g>

    <!-- 3 Shiny Chrome/Steel Water Taps -->
    <use href="#waterTap" x="945" y="316"/>
    <use href="#waterTap" x="1020" y="316"/>
    <use href="#waterTap" x="1095" y="316"/>
    <!-- Gentle Flowing Water from Middle Tap -->
    <line x1="1035" y1="308" x2="1035" y2="334" stroke="#85d4f2" stroke-width="2.5" opacity="0.85"/>

    <!-- Stainless Steel & Marble Washing Trough / Sink Counter -->
    <rect x="896" y="330" width="278" height="22" rx="2" fill="#e6ecf0" stroke="#6d7b82" stroke-width="1.3"/>
    <rect x="908" y="334" width="254" height="10" rx="2" fill="#c2d6db" stroke="#7d9599" stroke-width="1"/>
    <!-- Base Cabinet / Tiled Pedestal Under Sink -->
    <rect x="900" y="352" width="270" height="92" fill="#ebeff2" stroke="#8ca3a6" stroke-width="1.2"/>
    <rect x="900" y="352" width="270" height="92" fill="url(#washTiles)"/>
    <!-- Steel Drain Pipe Under Sink -->
    <rect x="1030" y="352" width="10" height="92" fill="url(#steelGrad)" stroke="#526069" stroke-width="1"/>
  </g>

  <!-- 5. BRIGHT MELLOW INTERIOR CEILING & PENDANT LAMPS -->
  <g id="ceiling-and-lights">
    <rect x="0" y="0" width="1280" height="58" fill="url(#ceilingGrad)" stroke="#a88c6f" stroke-width="1.2"/>
    <rect x="0" y="54" width="1280" height="12" fill="#d9a15b" stroke="#855f23" stroke-width="1.2"/>
    <!-- Perspective Wood Beams -->
    <g fill="#d9a15b" stroke="#855f23" stroke-width="1.1">
      <polygon points="40,0 74,0 116,54 84,54"/>
      <polygon points="240,0 272,0 296,54 266,54"/>
      <polygon points="440,0 470,0 478,54 450,54"/>
      <polygon points="626,0 654,0 654,54 626,54"/>
      <polygon points="810,0 840,0 830,54 802,54"/>
      <polygon points="1008,0 1040,0 1014,54 984,54"/>
      <polygon points="1206,0 1240,0 1196,54 1164,54"/>
    </g>

    <!-- Warm Glowing Hanging Lamps -->
    <use href="#warmLamp" x="245" y="66"/>
    <use href="#warmLamp" x="640" y="66"/>
    <use href="#warmLamp" x="1035" y="66"/>
  </g>

  <!-- 6. BRIGHT, CLEAN MARBLE COURTYARD FLOOR -->
  <rect x="0" y="444" width="1280" height="276" fill="url(#floorGrad)"/>
  <g stroke="#cfb49b" stroke-width="1.2" opacity="0.7">
    <line x1="0" y1="468" x2="1280" y2="468"/>
    <line x1="0" y1="498" x2="1280" y2="498"/>
    <line x1="0" y1="536" x2="1280" y2="536"/>
    <line x1="0" y1="584" x2="1280" y2="584"/>
    <line x1="0" y1="644" x2="1280" y2="644"/>
    <line x1="30" y1="720" x2="310" y2="444"/>
    <line x1="180" y1="720" x2="390" y2="444"/>
    <line x1="335" y1="720" x2="475" y2="444"/>
    <line x1="485" y1="720" x2="555" y2="444"/>
    <line x1="640" y1="720" x2="640" y2="444"/>
    <line x1="795" y1="720" x2="725" y2="444"/>
    <line x1="945" y1="720" x2="805" y2="444"/>
    <line x1="1100" y1="720" x2="890" y2="444"/>
    <line x1="1250" y1="720" x2="970" y2="444"/>
  </g>
  <!-- Soft Mellow Floor Light Reflections -->
  <ellipse cx="245" cy="590" rx="180" ry="45" fill="#fffdf5" opacity="0.35"/>
  <ellipse cx="640" cy="610" rx="220" ry="52" fill="#fffdf5" opacity="0.4"/>
  <ellipse cx="1035" cy="590" rx="180" ry="45" fill="#fffdf5" opacity="0.35"/>

  <!-- 7. ONLY THE SINGLE BACK WOVEN LANGAR MAT (FOR SANGAT TO SIT & EAT) -->
  <g id="langar-mat-back">
    <polygon points="154,522 1126,522 1138,530 142,530" fill="#b38866" opacity="0.35"/>
    <!-- Woven Fringe Ends -->
    <g stroke="#f0dfc7" stroke-width="2.2" stroke-linecap="round">
      <line x1="160" y1="470" x2="146" y2="470"/><line x1="156" y1="482" x2="142" y2="482"/><line x1="152" y1="494" x2="138" y2="494"/><line x1="148" y1="506" x2="134" y2="506"/><line x1="145" y1="518" x2="131" y2="518"/>
      <line x1="1120" y1="470" x2="1134" y2="470"/><line x1="1124" y1="482" x2="1138" y2="482"/><line x1="1128" y1="494" x2="1142" y2="494"/><line x1="1132" y1="506" x2="1146" y2="506"/><line x1="1135" y1="518" x2="1149" y2="518"/>
    </g>
    <!-- Main Mat Body -->
    <polygon points="162,466 1118,466 1136,522 144,522" fill="#b8412c" stroke="#592218" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Classic Dari Woven Stripes -->
    <polygon points="160,472 1120,472 1122,478 158,478" fill="#f7e3c1"/>
    <polygon points="156,482 1124,482 1126,488 154,488" fill="#eb9f2d"/>
    <polygon points="151,499 1129,499 1131,505 149,505" fill="#eb9f2d"/>
    <polygon points="148,509 1132,509 1134,515 146,515" fill="#f7e3c1"/>
    <line x1="153" y1="494" x2="1127" y2="494" stroke="#8c2b1b" stroke-width="1" opacity="0.45"/>
  </g>
</svg>