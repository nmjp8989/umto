    </g>
    <g id="flowering-plant" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0Q7-39-1-82M5-21Q-13-36-28-43M5-40Q22-53 30-65"
        fill="none" stroke="#4f7347" stroke-width="4.5"/>
      <path d="M5-20Q-21-15-40-45Q-11-51 5-20ZM5-33Q19-62 48-56Q40-30 5-33ZM3-46Q-21-43-37-71Q-8-78 3-46ZM2-59Q15-85 43-81Q34-57 2-59Z"
        fill="url(#leaf)" stroke="#4f7949" stroke-width="2.5"/>
      <path d="M-34-41L-1-24M11-36l30-17M-29-67l26 18M8-62l27-15" fill="none" stroke="#d0d78a" stroke-width="1.9"/>
      <g transform="translate(-3 -88)">
        <path d="M0-14Q-13-36-19-20Q-34-24-24-5Q-33 10-15 11Q-7 29 4 14Q22 25 22 9Q40 2 24-8Q26-27 11-22Q4-37 0-14Z" fill="#f0b46d" stroke="#ac6d44" stroke-width="2.4"/>
        <circle r="9" fill="#ba674b" stroke="#995540" stroke-width="2"/>
        <path d="M-4-3l2-1m3 6 2-2m-4 4 2 0" stroke="#f8d981" stroke-width="2"/>
      </g>
    </g>
    <g id="seed-shape">
      <path d="M-6 1Q-4-5 6-4Q8 2 1 5Q-5 6-6 1Z" fill="#edd3a4" stroke="#966c45" stroke-width="1.6"/>
      <path d="M-3 2L4-2" stroke="#bd9868" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <g data-camera-depth="-.18">
    <rect x="-130" y="-90" width="1540" height="900" fill="#d9b783"/>
    <image href="../mission-003/art/courtyard.webp" x="-62" y="-35" width="1404" height="790" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <rect x="-130" y="-90" width="1540" height="900" fill="url(#courtyard-light)" pointer-events="none"/>
  <rect id="dusk" x="-130" y="-90" width="1540" height="900" fill="url(#evening)" opacity="0" pointer-events="none"/>
  <g fill="url(#shadow)">
    <ellipse id="dadi-shadow" cx="646" cy="619" rx="94" ry="22"/>
    <ellipse id="mehar-shadow" cx="470" cy="633" rx="84" ry="19"/>
    <ellipse id="boy-shadow" cx="766" cy="629" rx="87" ry="19"/>
    <ellipse cx="642" cy="610" rx="238" ry="34"/>
  </g>
  <g id="rear-plant" transform="translate(936 591) scale(.84)" opacity="0">
    <use href="#blue-pot"/>
    <use href="#flowering-plant" transform="translate(0 -64)"/>
  </g>
  <g id="dadi-plane"><g id="dadi"/><g id="dadi-props"/></g>
  <g id="garden-bench" stroke="#845e40" stroke-linejoin="round">
    <path d="M460 529L482 532L476 601Q463 608 451 600ZM791 527L813 524L823 591Q815 603 800 598ZM517 540L528 543L519 600L505 604ZM751 530L770 528L778 593L758 598Z" fill="url(#wood)" stroke-width="4"/>
    <path d="M465 569Q636 575 807 562L808 576Q644 590 463 582Z" fill="#a3714d" stroke-width="3.5"/>
    <g transform="translate(0 32)">
      <path d="M428 480L787 459L842 493L470 521Z" fill="url(#wood)" stroke-width="4.5"/>
      <path d="M428 480L470 513L842 493L842 507L470 530L428 494Z" fill="#ab7450" stroke-width="4.3"/>
      <path d="M451 488L807 468M466 500L821 479M481 508L829 487" fill="none" stroke="#ab7b53" stroke-width="2.2"/>
      <path d="M499 520L702 506" fill="none" stroke="#d8aa79" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>
  <g id="bench-props"/>
  <g id="mehar-plane"><g id="mehar"/><g id="mehar-props"/></g>
  <g id="boy-plane"><g id="boy"/><g id="boy-props"/></g>

  <g id="objects">
    <g id="mehar-pot" opacity="0">
      <use href="#clay-pot"/>
      <g id="mehar-growth" transform="translate(0 -63)"><use href="#young-leaves"/></g>
    </g>
    <g id="sidak-pot" opacity="0">
      <use href="#blue-pot"/>
      <g id="sidak-flower" transform="translate(0 -63)"><use href="#flowering-plant"/></g>
      <g id="sidak-growth" transform="translate(0 -63)" opacity="0"><use href="#young-leaves"/></g>
    </g>
    <g id="seed-pouch" opacity="0">
      <path d="M-21-15Q-34-4-28 12Q-22 24 0 25Q22 24 28 12Q33-3 20-16L22-24Q18-30 10-27Q0-26-11-28Q-20-29-24-23Z"
        fill="url(#pouch-cloth)" stroke="#865e42" stroke-width="2.7" stroke-linejoin="round"/>
      <path d="M-22-16Q0-9 21-17M-9-16Q-4-30 4-17Q16-23 18-17M4-15L12-8" fill="none" stroke="#98734c" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M-20-5Q-24 6-16 15M16 11Q21 7 20 1" fill="none" stroke="#eed2a4" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="watering-can" opacity="0">
      <path d="M-29-12Q-60-22-54 9Q-52 24-29 17" fill="none" stroke="#456658" stroke-width="7" stroke-linecap="round"/>
      <path d="M27 4L69-39L77-41L79-30L33 19Z" fill="url(#metal)" stroke="#486958" stroke-width="3.2"/>
      <ellipse cx="76" cy="-38" rx="7" ry="10" transform="rotate(48 76 -38)" fill="#85a88b" stroke="#486958" stroke-width="2.5"/>
      <path d="M-33-14Q-38 6-26 26Q0 35 27 26Q37 7 31-13Z" fill="url(#metal)" stroke="#446456" stroke-width="3.3"/>
      <ellipse cy="-13" rx="32" ry="9.4" fill="#b3cdb0" stroke="#4e705d" stroke-width="2.7"/>
      <ellipse cy="-13" rx="24" ry="5" fill="#648e79"/>
      <path d="M-26-3Q-24 16-13 21M-23 26Q0 31 23 25" fill="none" stroke="#c3d9bc" stroke-width="3" stroke-linecap="round" opacity=".75"/>
    </g>
    <use id="seed-one" href="#seed-shape" opacity="0"/>
    <use id="seed-two" href="#seed-shape" opacity="0"/>
    <g id="soil-touch" opacity="0" fill="#af8b5f">
      <circle cx="-9" cy="-2" r="2"/><circle cx="4" cy="-5" r="1.8"/><circle cx="12" cy="1" r="2.2"/>
    </g>
    <g id="water" opacity="0" fill="none" stroke-linecap="round">
      <path id="water-ribbon" d="M0 0" stroke="#d8efed" stroke-width="3.7"/>
      <path id="water-glint" d="M0 0" stroke="#8ec7c7" stroke-width="1.6" stroke-dasharray="4 6"/>
      <ellipse id="water-ring" cx="570" cy="453" rx="14" ry="3" stroke="#b6d0b6" stroke-width="1.8"/>
    </g>
  </g>
  <g id="opening-field" opacity="0" pointer-events="none">
    <image href="../mission-003/art/banyan.webp" x="-62" y="-35" width="1404" height="790" preserveAspectRatio="xMidYMid slice"/>
  </g>
</svg>
