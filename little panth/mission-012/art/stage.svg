<svg xmlns="http://www.w3.org/2000/svg" id="stage" viewBox="0 0 1280 720" role="img" aria-labelledby="stage-title">
  <title id="stage-title">Mehar, Sidak, and Bibi Ji tending pots in a Punjabi village courtyard</title>
  <defs>
    <radialGradient id="courtyard-light" cx=".26" cy=".22" r=".88">
      <stop stop-color="#ffdf9a" stop-opacity=".16"/>
      <stop offset=".64" stop-color="#e3ac57" stop-opacity="0"/>
      <stop offset="1" stop-color="#755137" stop-opacity=".24"/>
    </radialGradient>
    <linearGradient id="wood" x2=".26" y2="1">
      <stop stop-color="#e1b479"/><stop offset="1" stop-color="#9d6b49"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="0" x2="1" y2=".72">
      <stop stop-color="#e6a570"/><stop offset=".43" stop-color="#c87951"/><stop offset="1" stop-color="#8a4639"/>
    </linearGradient>
    <linearGradient id="glaze" x1="0" x2="1" y2=".72">
      <stop stop-color="#9cc4b2"/><stop offset=".53" stop-color="#618c89"/><stop offset="1" stop-color="#35596b"/>
    </linearGradient>
    <linearGradient id="pouch-cloth" x2=".74" y2="1">
      <stop stop-color="#f2d2a0"/><stop offset="1" stop-color="#b8845d"/>
    </linearGradient>
    <linearGradient id="metal" x1=".25" x2=".9" y2="1">
      <stop stop-color="#a6c5a3"/><stop offset="1" stop-color="#517f6c"/>
    </linearGradient>
    <linearGradient id="leaf" x2=".9" y2=".86">
      <stop stop-color="#b6ce77"/><stop offset=".64" stop-color="#6f9e58"/><stop offset="1" stop-color="#4d7648"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop stop-color="#563721" stop-opacity=".49"/>
      <stop offset="1" stop-color="#563721" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="evening" cx=".65" cy=".3" r=".8">
      <stop stop-color="#ad7275" stop-opacity=".15"/>
      <stop offset="1" stop-color="#554463" stop-opacity=".59"/>
    </radialGradient>
    <g id="clay-pot">
      <path d="M-46-69Q-42-32-30-5Q0 7 30-5Q42-30 46-69Z" fill="url(#terracotta)" stroke="#7d4b3a" stroke-width="3.5"/>
      <path d="M-39-46Q0-34 39-46M-35-34Q0-24 35-34" fill="none" stroke="#f0b287" stroke-width="3.2" opacity=".72"/>
      <ellipse cy="-67" rx="51" ry="14" fill="#de9a6f" stroke="#8f5241" stroke-width="3"/>
      <ellipse cy="-68" rx="43" ry="9" fill="#65503d"/>
      <path d="M-35-68l9-2m9 5 11-3m9-4 10 2m11 1 9-1" stroke="#947451" stroke-width="2" stroke-linecap="round"/>
      <path d="M-50-66Q0-49 50-66" fill="none" stroke="#eeb28b" stroke-width="3.5"/>
    </g>
    <g id="blue-pot">
      <path d="M-46-69Q-42-32-30-5Q0 7 30-5Q42-30 46-69Z" fill="url(#glaze)" stroke="#41646a" stroke-width="3.5"/>
      <path d="M-39-48Q0-38 39-48M-35-34Q0-25 35-34" fill="none" stroke="#b4d4bd" stroke-width="3.2" opacity=".72"/>
      <ellipse cy="-67" rx="51" ry="14" fill="#96b8aa" stroke="#466b6c" stroke-width="3"/>
      <ellipse cy="-68" rx="43" ry="9" fill="#65503d"/>
      <path d="M-34-69l11 2m11 0 8-2m13 1 8 1m7-3 7 1" stroke="#927051" stroke-width="2" stroke-linecap="round"/>
      <path d="M-50-66Q0-49 50-66" fill="none" stroke="#c0d9c5" stroke-width="3.4"/>
    </g>
    <g id="young-leaves" stroke-linecap="round" stroke-linejoin="round">
