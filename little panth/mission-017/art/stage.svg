<svg xmlns="http://www.w3.org/2000/svg" id="stage" viewBox="0 0 1280 720" role="img" aria-labelledby="stage-title">
  <title id="stage-title">Sheru, Mehar, and Sidak by the still village canal</title>
  <defs>
    <radialGradient id="shadow">
      <stop stop-color="#503a28" stop-opacity=".55"/><stop offset="1" stop-color="#503a28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bank" x2=".34" y2="1">
      <stop stop-color="#dabc83" stop-opacity=".15"/><stop offset="1" stop-color="#b39969" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="canal-water" x2=".14" y2="1">
      <stop stop-color="#a4c6ab"/><stop offset=".46" stop-color="#78a8a6"/><stop offset="1" stop-color="#59858e"/>
    </linearGradient>
    <linearGradient id="dog-fur" x2=".26" y2="1">
      <stop stop-color="#e9be83"/><stop offset=".53" stop-color="#d39462"/><stop offset="1" stop-color="#ad7153"/>
    </linearGradient>
    <linearGradient id="ear-fur" x2=".48" y2="1">
