<svg xmlns="http://www.w3.org/2000/svg" id="stage" viewBox="0 0 1280 720" role="img" aria-labelledby="stage-title">
  <title id="stage-title">UMTO Studio’s Mehar, Sidak, and Bibi Ji in a sunny Punjabi courtyard with an orange ball and a bundle of sticks</title>
  <defs>
    <linearGradient id="stool-wood" x2=".5" y2="1">
      <stop stop-color="#bd905d"/>
      <stop offset="1" stop-color="#865d43"/>
    </linearGradient>
    <linearGradient id="stool-rope" x2=".1" y2="1">
      <stop stop-color="#dcc391"/>
      <stop offset="1" stop-color="#b7976c"/>
    </linearGradient>
    <radialGradient id="ball-color" cx=".3" cy=".24" r=".78">
      <stop stop-color="#ffcf78"/>
      <stop offset=".6" stop-color="#ef9d53"/>
      <stop offset="1" stop-color="#c76a40"/>
    </radialGradient>
    <radialGradient id="contact-shadow">
      <stop stop-color="#5d3b26" stop-opacity=".49"/>
      <stop offset="1" stop-color="#5d3b26" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm-courtyard" cx=".38" cy=".25" r=".82">
      <stop stop-color="#ffe7af" stop-opacity=".1"/>
      <stop offset=".7" stop-color="#604635" stop-opacity="0"/>
      <stop offset="1" stop-color="#604635" stop-opacity=".21"/>
    </radialGradient>
    <filter id="illustration-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".57" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".085"/>
      </feComponentTransfer>
    </filter>
    <g id="stick-left">
      <path d="M-65-4q2-6 11-5l45 2 11 3-7 4 5 4-7 3-50-3q-10-1-8-8Z" fill="#ba885c" stroke="#805b45" stroke-width="2.7"/>
      <path d="M-55-4q21 3 40 1" fill="none" stroke="#dfb582" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g id="stick-right">
      <path d="M-1-4-8-2 3 1-2 5l11-1 47 2q10 0 10-7-1-7-12-7L8-7Z" fill="#bf9064" stroke="#805b45" stroke-width="2.7"/>
      <path d="M10-3q27-1 44 1" fill="none" stroke="#e1b782" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </defs>
  <g data-camera-depth="-.18">
    <rect x="-130" y="-90" width="1540" height="900" fill="#e0b076"/>
    <image href="../mission-003/art/courtyard.webp" x="-62" y="-35" width="1404" height="790" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <path d="M-110-80h1500v880H-110Z" fill="url(#warm-courtyard)" pointer-events="none"/>
  <g id="shadows" fill="url(#contact-shadow)">
    <ellipse id="mehar-shadow" cx="408" cy="624" rx="95" ry="21"/>
    <ellipse id="boy-shadow" cx="720" cy="624" rx="87" ry="20"/>
    <ellipse id="dadi-shadow" cx="995" cy="610" rx="104" ry="24"/>
    <ellipse cx="589" cy="594" rx="117" ry="24"/>
  </g>
  <g id="dadi-plane">
    <g id="dadi"/>
    <g id="dadi-props"/>
  </g>
  <g id="stool" stroke-linejoin="round">
    <path d="M503 534l17 3-8 58q-9 5-18-2ZM667 526l17-3 7 59q-10 7-17 2ZM555 534l14 3-2 58-16 3ZM629 533l13-4 10 61-14 3Z" fill="url(#stool-wood)" stroke="#795640" stroke-width="4.2"/>
    <g transform="translate(0 -8)">
      <path d="m484 532 173-16 43 22-171 24-45-17Z" fill="url(#stool-rope)" stroke="#846246" stroke-width="4.1"/>
      <path d="m529 557 171-19v13l-170 20-46-18v-9Z" fill="#966b4b" stroke="#785640" stroke-width="3.5"/>
      <path d="m512 531 45 22m-27-25 44 23m-26-26 44 24m-24-27 44 24m-25-26 45 23m-26-26 45 24m-25-26 42 23m-27-25 43 21m-170-3 176-17m-169 23 178-19m-164 23 176-19" fill="none" stroke="#a68962" stroke-width="2.3" opacity=".72"/>
    </g>
  </g>
  <g id="stool-props"/>
  <g id="mehar-plane">
    <g id="mehar"/>
    <g id="mehar-props"/>
  </g>
  <g id="boy-plane">
    <g id="boy"/>
    <g id="boy-props"/>
  </g>
  <g id="floor-props">
    <g id="bundle" transform="translate(589 501) rotate(-4)" stroke-linecap="round" stroke-linejoin="round" opacity="0">
      <path data-wood-curve="-12" d="M-67 -12Q0 -12 67 -12" fill="none" stroke="#7e5941" stroke-width="16"/>
      <path data-wood-curve="-12" d="M-67 -12Q0 -12 67 -12" fill="none" stroke="#a97850" stroke-width="12"/>
      <path data-wood-curve="-15" d="M-67 -15Q0 -15 67 -15" fill="none" stroke="#e1b880" stroke-width="2.1"/>
      <path data-wood-curve="1" d="M-67 1Q0 1 67 1" fill="none" stroke="#8b654a" stroke-width="16"/>
      <path data-wood-curve="1" d="M-67 1Q0 1 67 1" fill="none" stroke="#c59864" stroke-width="12"/>
      <path data-wood-curve="-2" d="M-67 -2Q0 -2 67 -2" fill="none" stroke="#e1b880" stroke-width="2.1"/>
      <path data-wood-curve="14" d="M-67 14Q0 14 67 14" fill="none" stroke="#8b654b" stroke-width="16"/>
      <path data-wood-curve="14" d="M-67 14Q0 14 67 14" fill="none" stroke="#b6885c" stroke-width="12"/>
      <path data-wood-curve="11" d="M-67 11Q0 11 67 11" fill="none" stroke="#e1b880" stroke-width="2.1"/>
      <g id="bundle-cord" fill="none" stroke="#b47358" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-10-17q8 20 2 42m4-42q8 17 2 41m9-42q7 24 0 42" stroke-width="4.7"/>
        <path d="M0-16Q-26-35-22-41q11-6 25 19 9-28 20-19 5 11-19 24l19 7" stroke-width="3.6"/>
      </g>
    </g>
    <g id="mehar-stick" opacity="0">
      <use id="mehar-stick-left" href="#stick-left"/>
      <use id="mehar-stick-right" href="#stick-right"/>
    </g>
    <g id="boy-stick" opacity="0">
      <use id="boy-stick-left" href="#stick-left"/>
      <use id="boy-stick-right" href="#stick-right"/>
    </g>
    <g id="snap-fibers" opacity="0" stroke="#fde0a9" stroke-width="3" stroke-linecap="round">
      <path d="M-3-5-7-15m10 9 3-12m-7 24 3 10m7-10 8 7m-24-9-10 6"/>
    </g>
    <ellipse id="ball-shadow" cx="685" cy="624" rx="37" ry="12" fill="url(#contact-shadow)"/>
    <g id="ball" transform="translate(685 461)">
      <circle r="28" fill="url(#ball-color)" stroke="#ad633e" stroke-width="3.3"/>
      <path d="M-26-6q19 4 35 28m-24-44q25 13 35 36m-10-34q5-2 9-1" fill="none" stroke="#ffd383" stroke-width="4.9" stroke-linecap="round"/>
      <ellipse cx="-10" cy="-14" rx="7" ry="4.3" fill="#fff0af" opacity=".5" transform="rotate(-22 -10 -14)"/>
    </g>
    <path id="free-cord" d="M0 0q-11 14-31 9-11-1-20 6" fill="none" stroke="#a8674d" stroke-width="4.1" stroke-linecap="round" opacity="0"/>
  </g>
  <path d="M0 0h1280v720H0Z" filter="url(#illustration-grain)" opacity=".49" pointer-events="none"/>
</svg>
