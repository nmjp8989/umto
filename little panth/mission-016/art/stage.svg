      <path id="canal-ripples" d="M-24 419q116-25 258-18m37 10q76 22 177 20m70-1q114-16 202-37m72 10q98-31 206-32m46 24q90-11 184-7M-16 466q144-26 252-17m382-4q122-34 204-50"
