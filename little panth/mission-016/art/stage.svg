      <path d="M-24-194q38-14 61 9 19 16 47 15M-16-169q42 21 75 11" fill="none" stroke="#a6a0a0" stroke-width="3.2"/>
      <path d="M-72-179q9-24 36-28m-31 41q9 18 38 23" fill="none" stroke="#fff3d5" stroke-width="3.8"/>
    </g>
    <g id="stork-head">
