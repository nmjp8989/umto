    <path d="M465 527l282-24 97 28-25 27-322 10-31-16Z" fill="url(#timber)" stroke="#805c44" stroke-width="4"/>
    <path d="M465 531l34 26 320-9 24-16-3 16-21 13-320 10-35-25Z" fill="#af805a" stroke="#825e45" stroke-width="3.5"/>
    <path d="M489 533l122-11m-105 26 127-6m46-24 62-4m-68 28 130-10" fill="none" stroke="#ebc391" stroke-width="2.8"/>
