<svg xmlns="http://www.w3.org/2000/svg" id="stage" viewBox="0 0 1280 720" role="img" aria-labelledby="stage-title">
  <title id="stage-title">The fox and the stork share a meal in a Punjabi village garden</title>
  <defs>
    <radialGradient id="ground-shadow"><stop stop-color="#503725" stop-opacity=".52"/><stop offset="1" stop-color="#503725" stop-opacity="0"/></radialGradient>
    <linearGradient id="canal-water" x2=".19" y2="1">
      <stop stop-color="#c6d9b9"/><stop offset=".54" stop-color="#8bb8a7"/><stop offset="1" stop-color="#699697"/>
    </linearGradient>
    <linearGradient id="timber" x2=".19" y2="1">
      <stop stop-color="#e2b881"/><stop offset=".54" stop-color="#bc895d"/><stop offset="1" stop-color="#987050"/>
    </linearGradient>
    <linearGradient id="ceramic" x2=".88" y2=".72">
      <stop stop-color="#c6ddd1"/><stop offset=".53" stop-color="#92b4a6"/><stop offset="1" stop-color="#588983"/>
    </linearGradient>
    <linearGradient id="clay" x2=".85" y2=".49">
      <stop stop-color="#e8b786"/><stop offset=".48" stop-color="#c58b64"/><stop offset="1" stop-color="#9b624f"/>
