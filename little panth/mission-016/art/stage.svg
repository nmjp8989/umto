      <path d="M15-27q19-6 26 0-4 10-15 12" fill="#f5e7cc" stroke="#b1a595" stroke-width="2.4"/>
      <path d="M-29-5q15-9 22 1-5 11-22 9Z" fill="#cb8b6d" opacity=".79"/>
