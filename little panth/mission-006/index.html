body.reviewing .book .gurmukhi{font-size:clamp(18px,3vw,48px)}
body.reviewing .book[data-layout="cinema"] .art-page{grid-column:1/-1;padding:0}

body.reviewing .book[data-layout="cinema"] .gurmukhi{font-size:clamp(18px,2.5vw,36px)}
body.reviewing #review-panel{display:block;background:#fffcf4;padding:18px;border:1px solid #d6c7ac;border-radius:15px;font:14px/1.5 system-ui,sans-serif;color:#263528}

#review-panel button{cursor:pointer;appearance:none;border:1px solid #c7cdbd;border-radius:8px;padding:9px;background:#f6f7f1;color:#213b29;font-weight:650}

#review-panel .scene-list{display:grid;gap:4px;margin-bottom:12px}
#review-panel .scene-list button{text-align:left;padding:7px;font-size:12px}
#review-panel .actions{display:flex;gap:7px;flex-wrap:wrap;margin-block:11px}
#review-panel textarea{width:100%;min-height:75px;border-radius:7px;border:1px solid #c7cdbd;padding:8px;font:inherit;resize:vertical}
#review-panel small{color:#516758}
#review-panel .label{display:block;font-weight:bold;margin-bottom:4px}
@media(max-width:850px){body.reviewing .shell{grid-template-columns:1fr}body.reviewing .book{max-width:100%}}

<script>
window.addEventListener('DOMContentLoaded', () => {
 'use strict';
 const $=id=>document.getElementById(id);
 const {makeReading,readingAt}=window.LP004Reading;
 const book=$('book'), movie=$('movie'),svg=$('stage'), output=$('reading');
 const sound=new window.LP005Sound();
 const params=new URLSearchParams(location.search),reviewing=params.get('review')==='1';
 const parts=Object.fromEntries([...svg.querySelectorAll('[id]')].map(x=>[x.id,x]));
 const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
 const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
 const lerp=(a,b,t)=>a+(b-a)*t;
 const shots={
 morning:[0,0,1280,720],scamper:[60,42,1140,641],caught:[260,106,870,489],
 mercy:[175,70,1030,579],trap:[0,0,1280,720],return:[70,40,1140,641],
 chew:[315,135,865,487],friends:[0,0,1280,720]
 };
 let sceneIndex=0,position=0,playing=false,activated=false,frame=0,started=0,scenes=[],lastKey='',words=[],lastWord=-1;
 let notes={};
 try{notes=JSON.parse(localStorage.getItem('little-panth-06-review')||'{}')}catch{}
 const safeText=s=>String(s||'');
 const musicContext=sound.context;
 function makeFoley(name){
  const ctx=musicContext;if(!ctx)return null;
  const dur=name==='net'?0.63:name==='chew'?0.34:0.55;
  const buffer=ctx.createBuffer(1,Math.ceil(dur*ctx.sampleRate),ctx.sampleRate);
  const out=buffer.getChannelData(0);let seed=78413,low=0;
  for(let i=0;i<out.length;i++){
   const t=i/ctx.sampleRate;seed=(1664525*seed+1013904223)>>>0;
   const noise=(seed/2147483648-1);low+=.12*(noise-low);
   const envelope=Math.sin(Math.PI*t/dur);
   if(name==='net')out[i]=(Math.sin(2*Math.PI*(71*t-25*t*t))*.55+noise*.12)*Math.exp(-t*8);
   else if(name==='chew')out[i]=(noise*.23+Math.sin(2*Math.PI*790*t)*.18)*Math.exp(-(t%0.105)*41)*envelope;
   else out[i]=low*.43*envelope*(.5+.5*Math.sin(2*Math.PI*12*t));
  }
  return buffer;
 }
 if(musicContext)for(const name of ['rustle','net','chew'])sound.effects[name]=makeFoley(name);
 function effectsFor(scene){
  const a=scene.lines,at=(index,offset=0)=>Math.min(scene.duration-280,(a[index]?.start||0)+offset);
  if(scene.id==='scamper')return [{ms:at(0,550),sound:'rustle'},{ms:at(1,240),sound:'rustle'}];
  if(scene.id==='trap')return [{ms:at(1,580),sound:'net'}];
  if(scene.id==='return')return [{ms:at(0,630),sound:'rustle'}];
  if(scene.id==='chew')return [{ms:at(0,550),sound:'chew'},{ms:at(1,270),sound:'chew'},{ms:at(2,140),sound:'net'}];
  return [];
 }
 function compile(data,manifest,timings){
  let elapsed=0;
  return data.scenes.map((s,i)=>{
   let cursor=350;
   const lines=s.lines.map(id=>{
    const record=data.lines[id],voice=manifest[id],timing=timings[id],buffer=sound.clips.get(id);
    const count=record.pa.trim().split(/\s+/u).length;
    const duration=buffer?Math.round(buffer.duration*1000):Math.max(1850,count*455);
    const aligned=Boolean(buffer&&timing?.dialogueHash===voice?.hash&&timing.words?.length===count);
    const line={id,...record,start:cursor,duration,end:cursor+duration,reading:makeReading(record.pa,duration,aligned?timing.words:null),aligned};
    cursor=line.end+220;
    return line;
   });
   const entry={...s,lines,events:[],duration:cursor+(i===data.scenes.length-1?2600:650),episodeStart:elapsed};
   entry.events=effectsFor(entry);
   elapsed+=entry.duration;
   return entry;
  });
 }
 function renderReading(line,ms){
  const current=readingAt(line.reading,ms);
  const phrase=line.reading.phrases[current.phrase]||line.reading.phrases[0];
  const key=line.id+':'+current.phrase;
  if(lastKey!==key){
   lastKey=key;lastWord=-1;words=[];
   const fragment=document.createDocumentFragment();
   for(let i=phrase.first;i<phrase.end;i++){
    const element=document.createElement('span');
    element.className='word';element.textContent=line.reading.words[i];words.push(element);
    if(i>phrase.first)fragment.append(' ');
    fragment.append(element);
   }
   output.replaceChildren(fragment);
  }
  if(lastWord!==current.word){
   words[lastWord-phrase.first]?.removeAttribute('aria-current');
   words[current.word-phrase.first]?.setAttribute('aria-current','true');
   lastWord=current.word;
  }
  return current.word;
 }
 const isDuring=(ms,line,extra=0)=>!!line&&ms>=line.start&&ms<line.end+extra;
 function figurePose(scene,ms,line){
  const id=scene.id,t=ms/1000,still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const first=(scene.lines[0]?.end||2500),second=(scene.lines[1]?.end||5000);
  const p=parts;
  let lx=844,ly=600,mx=360,my=621,visibleMouse=true,net=0,netY=0;
  const wobble=still?0:Math.sin(t*2.4)*1.7;
  const part=(a,b)=>ease((ms-a)/Math.max(1,b-a));
  let awake=true,trap=0;
  if(id==='morning'){awake=false;visibleMouse=false;ly=604;}
  if(id==='scamper'){awake=false;mx=lerp(160,760,part(450,first+250));my=621-165*part(1700,second+200);}
  if(id==='caught'){mx=lerp(735,621,part(450,first+200));my=lerp(477,621,part(450,first+200));}
  if(id==='mercy'){mx=lerp(632,390,part(second-400,scene.duration-300));}
  if(id==='trap'){visibleMouse=false;lx=lerp(1040,844,part(250,first));trap=part(first+100,second-150);net=trap;netY=-280*(1-trap);}
  if(id==='return'){mx=lerp(115,619,part(250,first+700));my=621;net=1;}
  if(id==='chew'){mx=lerp(535,648,part(300,first));net=1-part(second-150,scene.duration-500);netY=-140*(1-net);}
  if(id==='friends'){mx=493;net=0;ly=596;}
  if(id==='trap'&&ms>=second-80)net=1;
  p.lion.setAttribute('transform','translate('+lx+' '+(ly+wobble)+')');
  p['lion-shadow'].setAttribute('cx',lx);p['lion-shadow'].setAttribute('opacity','.8');
  p.mouse.setAttribute('opacity',visibleMouse?'1':'0');
  p.mouse.setAttribute('transform','translate('+mx+' '+(my+(id==='scamper'||id==='return'?(still?0:-Math.abs(Math.sin(t*13))*6):wobble))+')');
  p['mouse-shadow'].setAttribute('cx',mx);p['mouse-shadow'].setAttribute('opacity',visibleMouse?'.65':'0');
  p['lion-sleep'].setAttribute('opacity',awake?'0':'1');
  p['lion-eyes'].setAttribute('opacity',awake?'1':'0');
  const speaking=line&&isDuring(ms,line)&&line.speaker;
  const wordProgress=speaking?readingAt(line.reading,ms-line.start).word:-1;
  const rhythm=still ? 0.25 :(Math.abs(Math.sin(t*14))*0.75+0.2);
  p['lion-mouth'].setAttribute('transform','translate(0 54) scale(1 '+(speaking==='lion'&&wordProgress>=0?rhythm:.1)+')');
  p['mouse-mouth'].setAttribute('d',speaking==='mouse'&&wordProgress>=0?'M61-18q11 17 18-1':'M61-19q8 9 17 1');
  const pawAngle=id==='caught'? -17:id==='mercy'? -34*part(250,second+400):id==='friends'?-13*Math.sin(t*1.7):0;
  p['lion-paw'].setAttribute('transform','rotate('+pawAngle+' -104 -70)');
  p.net.setAttribute('opacity',String(clamp(net)));
  p.net.setAttribute('transform','translate(0 '+netY+')');
  p['cut-ropes'].setAttribute('opacity',id==='chew'&&ms>first?String(part(first,second)):0);
  p['ending-sparkles'].setAttribute('opacity',id==='friends'?String(.5+.45*Math.abs(Math.sin(t*1.3))):'0');
  p['sun'].setAttribute('opacity',id==='friends'?'1':'.82');
  p['fireflies'].setAttribute('opacity',String(.6+Math.sin(t*1.9)*.3));
  p['tree-left'].setAttribute('transform','translate('+(still?0:Math.sin(t*.65)*1.7)+' 0)');
  p['tree-right'].setAttribute('transform','translate('+(still?0:-Math.sin(t*.7)*1.4)+' 0)');
 }
 function draw(ms){
  const scene=scenes[sceneIndex];if(!scene)return;
  position=clamp(ms,0,scene.duration);
  const line=scene.lines.findLast(x=>x.start<=position)||scene.lines[0];
  renderReading(line,position-line.start);
  const shot=shots[scene.id];const sway=Math.sin(ms/1500)*2.8;
  const dynamic=scene.id==='scamper'?Math.min(80,ms/80):scene.id==='return'?Math.min(70,ms/95):0;
  const camera=[shot[0]+dynamic+sway,shot[1],shot[2],shot[3]];
  svg.setAttribute('viewBox',camera.map(Math.round).join(' '));
  figurePose(scene,position,line);
  if(reviewing)$('voice-progress').textContent=sound.clips.size+' / '+Object.keys(window.storyData.lines).length+' generated voice clips · '+Math.floor(position/1000)+'s / '+Math.floor(scene.duration/1000)+'s';
 }
 function stop(){playing=false;sound.stop();cancelAnimationFrame(frame)}
 function select(i){
  sceneIndex=i;position=0;lastKey='';lastWord=-1;
  const scene=scenes[i];
  book.dataset.layout=scene.layout||'spread';
  book.dataset.scene=scene.id;
  book.dataset.caption=scene.id==='chew'?'top':'bottom';
  draw(0);if(reviewing)paintReview();
 }
 function animate(now){
  if(!playing)return;
  const scene=scenes[sceneIndex];
  const time=sound.elapsed()??(now-started);
  if(time>=scene.duration){
   if(!reviewing&&sceneIndex+1<scenes.length){select(sceneIndex+1);play();return}
   stop();draw(scene.duration);return;
  }
  draw(time);frame=requestAnimationFrame(animate);
 }
 function play(){if(position>=scenes[sceneIndex].duration)draw(0);playing=true;started=performance.now()-position;
  if(activated)sound.playScene(scenes[sceneIndex],position);
  cancelAnimationFrame(frame);frame=requestAnimationFrame(animate);
 }
 async function withAudio(restart=false){
  if(!scenes.length)return;
  if(restart){stop();select(reviewing?sceneIndex:0)}
  try{activated=await sound.unlock()}catch{activated=false}
  play();
 }
 function touch(){if(!reviewing&&(!activated||!playing))withAudio(!playing)}
 movie.addEventListener('click',touch);
 movie.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();touch()}});
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){stop();draw(position)}});
 window.addEventListener('pagehide',stop);
 function save(){try{localStorage.setItem('little-panth-06-review',JSON.stringify(notes))}catch{}}
 function paintReview(){
  const scene=scenes[sceneIndex],current=notes[scene.id]||{};
  $('scene-name').textContent=(sceneIndex+1)+'. '+scene.title;
  $('scene-guidance').textContent=safeText(scene.review);
  $('scene-note').value=current.note||'';
  $('review-scenes').replaceChildren(...scenes.map((s,i)=>{
   const b=document.createElement('button');b.textContent=(i+1)+'. '+s.title+(notes[s.id]?.status==='approved'?' ✓':notes[s.id]?.status==='changes'?' !':'');
   if(i===sceneIndex)b.classList.add('selected');
   b.addEventListener('click',()=>{stop();select(i)});return b;
  }));
 }
 function mark(status){const s=scenes[sceneIndex];notes[s.id]={...(notes[s.id]||{}),status};save();paintReview()}
 function setupReview(){
  document.body.classList.add('reviewing');
  $('scene-play').onclick=()=>{if(playing){stop();draw(position)}else withAudio(false)};
  $('scene-restart').onclick=()=>{stop();select(sceneIndex);withAudio(false)};
  $('scene-approve').onclick=()=>mark('approved');
  $('scene-changes').onclick=()=>mark('changes');
  $('scene-note').oninput=e=>{const id=scenes[sceneIndex].id;notes[id]={...(notes[id]||{}),note:e.target.value};save()};
  $('download-notes').onclick=()=>{
   const file=new Blob([JSON.stringify({mission:6,title:window.storyData.title,review:notes},null,2)],{type:'application/json'});
   const link=document.createElement('a');const url=URL.createObjectURL(file);link.href=url;link.download='little-panth-mission-006-review.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1200);
  };
  paintReview();
 }
 async function start(){
  const fetchJSON=async(url,fallback)=>{try{const res=await fetch(url,{cache:'no-cache'});if(!res.ok)throw Error(url);return await res.json()}catch{return fallback}};
  const [data,manifest,timings]=await Promise.all([fetchJSON('dialogue.json',null),fetchJSON('audio/generation-manifest.json',{}),fetchJSON('audio/word-timings.json',{})]);
  if(!data)throw Error('dialogue.json missing');
  window.storyData=data;
  await document.fonts.load('700 48px "Little Panth Gurmukhi"','ਸ਼ੇਰ ਤੇ ਚੂਹਾ').catch(()=>{});
  const voiceIds=Object.keys(data.lines).filter(id=>manifest[id]?.text===data.lines[id].pa);
  await sound.load(voiceIds);
  scenes=compile(data,manifest,timings);
  $('loading').hidden=true;
  select(0);
  if(reviewing)setupReview();else play();
  // The scene-review mode is used to approve every drawing before exporting video.
  if(params.get('test')==='1')window.lp006Test={seek(i,ms){stop();select(i);draw(ms)},state:()=>({scene:sceneIndex,position,playing,clips:sound.clips.size,line:scenes[sceneIndex].lines.findLast(x=>x.start<=position)?.id})};
 }
 start().catch(error=>{console.error(error);$('loading').textContent='ਕਹਾਣੀ ਲੋਡ ਨਹੀਂ ਹੋ ਸਕੀ।'});
});
</script>
