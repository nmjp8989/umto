<link rel="stylesheet" href="../mission-004/style.css?v=storybook">

<style>
.movie{background:#b3d9ac;border-color:#899b68;touch-action:manipulation}
.book[data-layout="cinema"] .movie{background:#b5d7a0}
#stage{width:100%;height:100%;display:block}
#stage text{font-family:system-ui,sans-serif}
#leaf-a,#leaf-b,#leaf-c{transform-box:fill-box;transform-origin:center}
#review-panel{display:none}
body.reviewing{background:#f4f0e5}
body.reviewing .shell{max-width:1560px;margin:auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
body.reviewing .book{height:auto;min-height:0;aspect-ratio:16/9;grid-template-columns:1fr 1fr;overflow:hidden;border:1px solid #d3c3a8;border-radius:16px}
body.reviewing .book .art-page{grid-column:1;grid-row:1;padding:15px}
body.reviewing .book .reading-page{grid-column:2;grid-row:1;padding:28px}
body.reviewing .book .gurmukhi{font-size:clamp(18px,3vw,48px)}
body.reviewing .book[data-layout="cinema"] .art-page{grid-column:1/-1;padding:0}
body.reviewing .book[data-layout="cinema"] .reading-page{position:absolute;grid-column:1/-1;bottom:4%;padding:0;inset-inline:6%;background:transparent}
body.reviewing .book[data-layout="cinema"] .gurmukhi{font-size:clamp(18px,2.5vw,36px)}
body.reviewing #review-panel{display:block;background:#fffcf4;padding:18px;border:1px solid #d6c7ac;border-radius:15px;font:14px/1.5 system-ui,sans-serif;color:#263528}
#review-panel h1{font-size:20px;margin:0 0 3px}
#review-panel p{margin:4px 0 12px}
#review-panel button{cursor:pointer;appearance:none;border:1px solid #c7cdbd;border-radius:8px;padding:9px;background:#f6f7f1;color:#213b29;font-weight:650}
#review-panel button:hover{background:#e6eddf}
#review-panel button.selected{border-color:#315b3f;background:#e5f1e2}
#review-panel .scene-list{display:grid;gap:4px;margin-bottom:12px}
#review-panel .scene-list button{text-align:left;padding:7px;font-size:12px}
#review-panel .actions{display:flex;gap:7px;flex-wrap:wrap;margin-block:11px}
#review-panel textarea{width:100%;min-height:75px;border-radius:7px;border:1px solid #c7cdbd;padding:8px;font:inherit;resize:vertical}
#review-panel small{color:#516758}
#review-panel .label{display:block;font-weight:bold;margin-bottom:4px}
@media(max-width:850px){body.reviewing .shell{grid-template-columns:1fr}body.reviewing .book{max-width:100%}}
</style>
<script defer src="../mission-004/reading.js"></script>
