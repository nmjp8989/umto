<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Panth | Brand preview</title><style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#f6f6ef;color:#272725;margin:0}main{max-width:940px;margin:32px auto;padding:16px}h1{font-size:24px}a{color:#8c4417}#stage{position:relative;aspect-ratio:16/9;background:white;border:1px solid #e2e1db;border-radius:10px;overflow:hidden;display:grid;place-items:center}#stage>img,#stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain}button{background:#ff7901;color:#201609;border:0;border-radius:8px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;margin:12px 8px 0 0}button+button{background:#006ffd;color:#fff}button:disabled{opacity:.5}p{line-height:1.5}
</style></head><body><main><a href="all-missions.html">‹ Back to Little Panth</a><h1>Little Panth video branding</h1><div id="stage"><img src="little-panth-logo.svg?v=2" alt="Little Panth logo"></div><button id="intro" disabled>Play intro · 4.5s</button><button id="transition" disabled>Play transition · 3s</button><p id="status" role="status">Bouncing letters, animated children, a golden swoosh and a cheerful original chime and a childlike voice saying Little Panth. The preview holds the finished logo at the same size. Video exports fade smoothly into the next story.</p><p><a href="little-panth-logo.svg" download>SVG vector logo</a></p></main><script src="brand-motion.js?v=4"></script><script src="brand-bumper.js?v=4"></script><script>
const stage=document.getElementById('stage'),status=document.getElementById('status'),buttons=[...document.querySelectorAll('button')];
async function preview(intro){buttons.forEach(b=>b.disabled=true);try{await LPBrand.prepare();await LPBrand.play(stage,intro,()=>true,{hold:true});status.textContent='Preview complete. The logo holds its final position.'+(LPBrand.hasVoice()?' Voice sting played.':' Voice recording is not available yet; chime only.');}catch(e){status.textContent=e.message;}finally{LPBrand.close();buttons.forEach(b=>b.disabled=false);}}
LPBrand.showStill(stage).catch(e=>{status.textContent=e.message;}).finally(()=>buttons.forEach(b=>b.disabled=false));
buttons[0].onclick=()=>preview(true);buttons[1].onclick=()=>preview(false);
</script></body></html>
